spring.application.name=tapdata-l3-core

# Logging
logging.level.root=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# =============================================================================
# PluginCenter — Maven 仓库配置
# =============================================================================
# 所有 Maven 坐标下载（step 模块 jar + runtime deps + 传递依赖）都从以下仓库解析。
#
# 优先级（高→低）：
#   1. CLI --remote-repos / --nexus-repo / --local-repo-dir / --plugins-dir
#   2. JVM -Dl3.plugin.remote-repos=...
#   3. 本文件 / YAML / 环境变量
#   4. 内置默认（见下方每项 default）
#
# Spring Boot relaxed binding — 以下写法都等价：
#   l3.plugin.remote-repos=...  (properties)
#   l3.plugin.remoteRepos=...   (camelCase)
#   L3_PLUGIN_REMOTE_REPOS=...  (env var)

# 远端仓库列表 —— 顺序决定 lookup 优先级（先命中先用）
# 默认只含 Maven Central。公司内网请改成私服优先：
#   l3.plugin.remote-repos=https://nexus.internal.com/repository/maven-public,https://repo.maven.apache.org/maven2/
l3.plugin.remote-repos=https://repo.maven.apache.org/maven2/

# 本地 Maven 仓库（artifact 缓存目录）
l3.plugin.local-repo-dir=${user.home}/.m2/repository

# PF4J legacy 插件目录（plugin.properties zip/jar 包）
l3.plugin.plugins-dir=${user.home}/.tap-l3/plugins
