apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tapdata-engine.fullname" . }}
  labels:
    {{- include "tapdata-engine.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tapdata-engine.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "tapdata-engine.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if hasKey .Values "initContainers" }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- else }}
      initContainers:
        - name: wait-for-tapdata-server
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              URL="{{ .Values.env.backendUrl }}"
              STRIP_PROTO=${URL#http://}
              STRIP_PROTO=${STRIP_PROTO#https://}
              STRIP_PATH=${STRIP_PROTO%%/*}
              HOST=${STRIP_PATH%%:*}
              PORT=${STRIP_PATH##*:}
              echo "Waiting for TapData Server (${HOST}:${PORT}) to be available..."
              until nc -z -w 3 ${HOST} ${PORT}; do
                echo "TapData Server is not available yet, retrying in 5 seconds..."
                sleep 5
              done
              echo "TapData Server is available, starting TapData Engine..."
      {{- end }}
      containers:
        - name: tapdata-engine
          image: {{ include "tapdata-engine.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: MODULE
              value: "{{ .Values.env.module }}"
            - name: MONGODB_CONNECTION_STRING
              value: "{{ .Values.global.mongodb.hosts }}/{{ .Values.global.mongodb.database }}?authSource={{ .Values.global.mongodb.authSource }}"
            - name: MONGODB_USER
              value: "{{ .Values.global.mongodb.user }}"
            - name: MONGODB_PASSWORD
              value: "{{ .Values.global.mongodb.password }}"
            - name: BACKENDURL
              value: "{{ .Values.env.backendUrl }}"
            - name: JAVA_VERSION
              value: "{{ .Values.env.javaVersion }}"
            - name: TZ
              value: "{{ .Values.env.tz }}"
            - name: LICENSE_HOST
              value: "{{ .Values.env.licenseHost }}"
            - name: TAPDATA_WORK_DIR
              value: "/tapdata/apps"
          # 启动探针 —— Engine 需等 TM 就绪后再拉起 agent 进程，冷启动可能超过 liveness 窗口。
          # 启动探针通过前 liveness 不生效，避免慢启动被 SIGKILL（Exit Code 137）。
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            {{- omit .Values.startupProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pgrep -f '/tapdata/apps/components/tapdata-agent.jar'
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /tmp/conf
            - name: logs
              mountPath: /tapdata/apps/logs
          # 镜像内 application.yml 的 accessCode 是占位符 <ACCESS_CODE>，Engine 用它会登录 TM 失败
          # （无法注册、跑不了任务）。启动前就地替换成 TM 初始化 admin 用户的 accessCode。
          command:
            - /bin/bash
            - -c
            - sed -i -E "s#^( *accessCode:).*#\1 '3324cfdf-7d3e-4792-bd32-571638d4562f'#" /tapdata/apps/application.yml && exec /tapdata/docker-entrypoint.sh
      volumes:
        - name: config
          configMap:
            name: {{ include "tapdata-engine.fullname" . }}-config
        - name: logs
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
