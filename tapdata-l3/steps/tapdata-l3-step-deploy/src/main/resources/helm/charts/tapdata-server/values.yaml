global:
  mongodb:
    replicaSetName: tapdata-mongodb
    protocol: mongodb
    user: root
    password: AbcDef123
    authSource: admin
    database: tapdata
    hosts: "tapdata-mongodb-0.tapdata-mongodb-svc:27017,tapdata-mongodb-1.tapdata-mongodb-svc:27017,tapdata-mongodb-2.tapdata-mongodb-svc:27017"
  imagePullSecret:
    enabled: false
    name: registry-auth
    registry: ""
    username: ""
    password: ""
  imagePullSecrets: []

replicaCount: 2

image:
  repository: tapdata8/tapdata
  tag: latest
  kubectlRepository: bitnami/kubectl
  kubectlTag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  name: tapdata-server-svr
  type: ClusterIP
  port: 3030
  targetPort: 3030
  nodePort: 30303

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 2Gi

env:
  module: frontend
  frontendWorkerCount: 1
  backendUrl: "http://tapdata-server-svr:3030/api/"
  javaVersion: java17
  tz: Asia/Shanghai
  licenseHost: "113.98.206.142:18080"
  license: ""

podAnnotations: {}

# 启动探针 —— 覆盖 TM Java 进程慢启动（首次部署可达 10 分钟以上）。
# 启动探针成功前 livenessProbe 不会执行，避免慢启动被 SIGKILL（Exit Code 137 → crash-loop）。
# 窗口 = periodSeconds × failureThreshold = 10s × 90 = 900s。
# 同一处理器/阈值即可用于 server / engine / apiserver，按需调整。
startupProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 90

podSecurityContext: {}

securityContext: {}

nodeSelector: {}

tolerations: []

affinity: {}
