# MongoDB（测试用单实例，独立于 TM/engine）。
# 生产/HA 建议用 MongoDB Community Operator 的副本集；L3 为隔离与速度采用单副本 + 认证。
apiVersion: v1
kind: Service
metadata:
  name: tapdata-mongodb
  labels:
    app: tapdata-mongodb
    app.kubernetes.io/part-of: tapdata
spec:
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
      protocol: TCP
  selector:
    app: tapdata-mongodb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tapdata-mongodb
  labels:
    app: tapdata-mongodb
    app.kubernetes.io/part-of: tapdata
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tapdata-mongodb
  template:
    metadata:
      labels:
        app: tapdata-mongodb
    spec:
      ${IMAGE_PULL_SECRETS_BLOCK}
      containers:
        - name: mongodb
          image: "${MONGO_IMAGE}"
          imagePullPolicy: IfNotPresent
          args: ["--bind_ip_all"]
          ports:
            - name: mongo
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "${MONGO_USER}"
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: "${MONGO_PASSWORD}"
          readinessProbe:
            tcpSocket:
              port: mongo
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mongo
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          emptyDir: {}
