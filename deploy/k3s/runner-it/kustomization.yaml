apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - runner-git-askpass.yaml
  - runner-cache-pvc.yaml
  - runner-cache-prune.yaml
  - runner-it.yaml
  - remaining-runners.yaml

patches:
  - path: runner-cache-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: app.kubernetes.io/component=github-runner
  - path: runner-auto-update-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: runner-build-(common-[1-8]|enterprise)
