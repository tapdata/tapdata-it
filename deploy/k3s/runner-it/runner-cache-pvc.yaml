apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runner-build-source
  namespace: tapdata-it
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 300Gi
