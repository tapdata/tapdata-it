kind: Deployment
metadata:
  name: runner-build-common-7
  namespace: tapdata-it
  labels:
    app.kubernetes.io/name: runner-build-common
    app.kubernetes.io/instance: runner-build-common-7
    app.kubernetes.io/component: github-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: runner-build-common
      app.kubernetes.io/instance: runner-build-common-7
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runner-build-common
        app.kubernetes.io/instance: runner-build-common-7
        app.kubernetes.io/component: github-runner
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: tapserver193
      terminationGracePeriodSeconds: 60
      hostAliases:
        - ip: 192.168.1.184
          hostnames: [fileserver.tapdata.net, nexus.tapdata.net]
        - ip: 192.168.1.170
          hostnames: [buildserver.tapdata.io]
      containers:
        - name: runner
          image: harbor.internal.tapdata.io/tapdata/github-action-runner:5.12
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          envFrom:
            - secretRef:
                name: runner-it-auth
          env:
            - name: RUN_AS_ROOT
              value: "true"
            - name: RUNNER_SCOPE
              value: org
            - name: ORG_NAME
              value: tapdata
            - name: LABELS
              value: office-build
            - name: REPO_URL
              value: https://github.com/tapdata/tapdata-application
            - name: RUNNER_NAME_PREFIX
              value: office-build-op-7
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 12Gi
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: build-source
              mountPath: /root/build_source
            - name: runner-work
              mountPath: /_work
            - name: maven-cache
              mountPath: /root/.m2
            - name: java-truststore
              mountPath: /usr/java/jdk-17.0.12/lib/security/cacerts
              subPath: cacerts
              readOnly: true
      volumes:
        - name: docker-sock
          hostPath:
            path: /run/podman/podman.sock
            type: Socket
        - name: build-source
          persistentVolumeClaim:
            claimName: runner-build-source
        - name: runner-work
          hostPath:
            path: /home/k3s-data/build-runner-common/ins-7/_work
            type: DirectoryOrCreate
        - name: maven-cache
          persistentVolumeClaim:
            claimName: runner-maven-cache
        - name: java-truststore
          secret:
            secretName: runner-it-truststore
            defaultMode: 0444
