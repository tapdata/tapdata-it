apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner-build-enterprise
  namespace: tapdata-it
  labels:
    app.kubernetes.io/name: runner-build
    app.kubernetes.io/instance: runner-build-enterprise
    app.kubernetes.io/component: github-runner
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: runner-build
      app.kubernetes.io/instance: runner-build-enterprise
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runner-build
        app.kubernetes.io/instance: runner-build-enterprise
        app.kubernetes.io/component: github-runner
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: tapserver193
      terminationGracePeriodSeconds: 60
      hostAliases:
        - ip: 192.168.1.184
          hostnames: [fileserver.tapdata.net, nexus.tapdata.net]
        - ip: 192.168.1.170
          hostnames: [buildserver.tapdata.io]
      containers:
        - name: runner
          image: harbor.internal.tapdata.io/tapdata/github-action-runner:5.12
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          envFrom:
            - secretRef:
                name: runner-it-auth
          env:
            - name: RUN_AS_ROOT
              value: "true"
            - name: RUNNER_SCOPE
              value: org
            - name: ORG_NAME
              value: tapdata
            - name: LABELS
              value: office-build
            - name: REPO_URL
              value: https://github.com/tapdata/tapdata-enterprise
            - name: RUNNER_NAME_PREFIX
              value: office-build-op
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-sock
          hostPath:
            path: /run/podman/podman.sock
            type: Socket
---
