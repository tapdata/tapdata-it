case_id: "L3-F-04"
scenario: "数据校验全流程 — 一致 → 造差异被检出 → 修复后恢复一致"
group: "functional"
description: >-
  L3 功能黄金路径（对应 wiki L3-F-04）：
  (1) dbforge 创建 TapData MongoDB 中间库 + 部署 1 TM / 1 Engine / 1 ApiServer；
  (2) dbforge 创建源/目标两个 MySQL，初始化源库 2 张表各 200 行；
  (3) 注册数据源、创建全量+增量复制任务，等待全量完成、CDC 就绪；
  (4) 创建 VDC 校验任务（value 全字段校验），执行并断言初始状态完全一致；
  (5) 在目标端旁路注入一条脏数据（source 不存在的行）模拟数据漂移；
  (6) 重新执行校验，断言校验能检出差异（负向断言 expect_failure）；
  (7) 清理脏数据后再次执行校验，断言恢复完全一致；
  (8) 收尾：卸载集群，释放全部 dbforge 租约。

# 说明：
# - 使用 value 全字段校验：能检出「行数相同但字段值不同」的差异，比 row_count 更严格。
# - 负向断言依赖 tm_assert_inspect_result 统计 Inspect 的 stats[]/difference_number，
#   校验未生效时会因「差异未被检出」而失败（不会出现假通过）。
env:
  TM_BASE_URL: "http://192.168.1.193:30324"

steps:
  # ============================================================
  # 0. 申请 License
  # ============================================================
  - id: "fetch_license"
    action: "get_license"
    inputs:
      base_url: "http://192.168.1.184:18080"
      username: "license-temp"
      password: "Gotapd8!"
      customer: "tapdata-it"
      reason: "L3 data verification (VDC) e2e test"
      valid_days: 30
      version: "4.25.0"
      license_type: "OP"
      engine_limit: 3
    outputs: [license]
    timeout_seconds: 60

  # ============================================================
  # 1. dbforge 创建 TapData MongoDB 中间库
  # ============================================================
  - id: "create_mongo"
    action: "dbforge_create_database"
    inputs:
      db_type: "mongodb"
      mode: "dedicated"
      topology: "replicaset"
    outputs: [lease_id, uri, host, internal_host, port, database, username, password]
    timeout_seconds: 300

  # ============================================================
  # 2. 在租约 MongoDB 的 admin 库补建同名用户
  # ============================================================
  - id: "grant_mongo_admin_user"
    action: "exec"
    inputs:
      host: "localhost"
      namespace: "dbforge-env-ephemeral"
      pod: "#{ #steps['create_mongo'].outputs['lease_id'] }-0"
      container: "mongodb"
      command: "mongosh -u \"$MONGODB_INITDB_ROOT_USERNAME\" -p \"$MONGODB_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --quiet --eval \"try { db.getSiblingDB('admin').createUser({user:'#{ #steps['create_mongo'].outputs['username'] }',pwd:'#{ #steps['create_mongo'].outputs['password'] }',roles:[{role:'dbOwner',db:'#{ #steps['create_mongo'].outputs['database'] }'}]}); print('GRANT_OK created'); } catch(e) { if (e.message.includes('already exists')) { print('GRANT_OK exists'); } else { throw e; } }\""
      expect_stdout_contains: "GRANT_OK"
    timeout_seconds: 60

  # ============================================================
  # 3. 部署 TapData：1 TM + 0 Engine + 1 ApiServer
  # ============================================================
  - id: "deploy_tapdata"
    action: "deploy_tapdata"
    inputs:
      host: "localhost"
      prebuilt_image: "192.168.1.184:5001/tapdata/tapdata-enterprise:latest"
      harbor_registry: "192.168.1.184:5001"
      mongodb_uri: "mongodb://#{ #steps['create_mongo'].outputs['username'] }:#{ #steps['create_mongo'].outputs['password'] }@#{ #steps['create_mongo'].outputs['internal_host'] }:#{ #steps['create_mongo'].outputs['internal_port'] }/#{ #steps['create_mongo'].outputs['database'] }?authSource=admin"
      mongodb_user: "#{ #steps['create_mongo'].outputs['username'] }"
      mongodb_password: "#{ #steps['create_mongo'].outputs['password'] }"
      mongodb_database: "#{ #steps['create_mongo'].outputs['database'] }"
      mongodb_auth_source: "admin"
      namespace: "tapdata-l3-f04"
      server_replicas: 1
      engine_replicas: 0
      apiserver_replicas: 1
      backend_url: "http://tapdata-server-svr.tapdata-l3-f04.svc.cluster.local:3030/api/"
      license_host: "192.168.1.184:18080"
      license: "#{ #steps['fetch_license'].outputs['license'] }"
    outputs: [namespace, helmRelease]
    # TM 冷启动实测 8~13 分钟，900s 不够
    timeout_seconds: 1500

  # ============================================================
  # 4. 暴露 TM API → NodePort 30324
  # ============================================================
  - id: "expose_tm_nodeport"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-l3-f04"
      command: "patch svc tapdata-server-svr --type=merge -p '{\"spec\":{\"type\":\"NodePort\",\"ports\":[{\"port\":3030,\"targetPort\":3030,\"nodePort\":30324,\"protocol\":\"TCP\"}]}}'"
      expect_stdout_contains: "patched"
    timeout_seconds: 60

  # ============================================================
  # 5. 等待各组件就绪
  # ============================================================
  - id: "tm_replicas_1"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-l3-f04"
      command: "get deploy tapdata-tapdata-server -o jsonpath='{.status.readyReplicas}'"
      expect_stdout_equals: "1"
      max_attempts: 90
      poll_interval_seconds: 5
    timeout_seconds: 500

  - id: "engine_replicas_0"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-l3-f04"
      command: "get deploy tapdata-tapdata-engine -o jsonpath='{.spec.replicas}'"
      expect_stdout_equals: "0"
      max_attempts: 60
      poll_interval_seconds: 5
    timeout_seconds: 400

  - id: "apiserver_replicas_1"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-l3-f04"
      command: "get deploy tapdata-tapdata-apiserver -o jsonpath='{.status.readyReplicas}'"
      expect_stdout_equals: "1"
      max_attempts: 60
      poll_interval_seconds: 5
    timeout_seconds: 400

  # ============================================================
  # 6. 登录 TM
  # ============================================================
  - id: "login_tm"
    action: "tm_login"
    inputs:
      wait_timeout_seconds: 300
      poll_interval_ms: 5000
    outputs: [access_token, tm_base_url]
    timeout_seconds: 360

  # ============================================================
  # 7. 对齐 accessCode
  # ============================================================
  - id: "align_access_code"
    action: "exec"
    inputs:
      host: "localhost"
      namespace: "dbforge-env-ephemeral"
      pod: "#{ #steps['create_mongo'].outputs['lease_id'] }-0"
      container: "mongodb"
      command: "mongosh -u \"$MONGODB_INITDB_ROOT_USERNAME\" -p \"$MONGODB_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --quiet --eval \"var dbx=db.getSiblingDB('#{ #steps['create_mongo'].outputs['database'] }'); var done=0; ['User','users'].forEach(function(c){ if(done===0){ var col=dbx.getCollection(c); if(col.countDocuments({\\$or:[{accesscode:'<ACCESS_CODE>'},{accessCode:'<ACCESS_CODE>'}]})>0){ done=1; return; } var u=col.findOne({\\$or:[{accesscode:'3324cfdf-7d3e-4792-bd32-571638d4562f'},{accessCode:'3324cfdf-7d3e-4792-bd32-571638d4562f'}]}); if(u){ u._id=new ObjectId(); delete u.accessCode; u.accesscode='<ACCESS_CODE>'; u.email='admin-f04@tapdata.io'; if(u.username){ u.username='admin-f04'; } col.insertOne(u); done=1; } } }); print('ALIGN_OK inserted='+done);\""
      expect_stdout_contains: "ALIGN_OK inserted=1"
    timeout_seconds: 60

  # ============================================================
  # 8. 扩容 engine 到 1 副本
  # ============================================================
  - id: "scale_engine_to_1"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-l3-f04"
      command: "scale deploy tapdata-tapdata-engine --replicas=1"
      expect_stdout_contains: "scaled"
    timeout_seconds: 60

  - id: "engine_ready_1"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-l3-f04"
      command: "get deploy tapdata-tapdata-engine -o jsonpath='{.status.readyReplicas}'"
      expect_stdout_equals: "1"
      max_attempts: 90
      poll_interval_seconds: 5
    timeout_seconds: 500

  # ============================================================
  # 9. 注册 connector
  # ============================================================
  - id: "deploy_connectors"
    action: "exec"
    inputs:
      host: "localhost"
      namespace: "tapdata-l3-f04"
      pod: "tapdata-tapdata-engine"
      command: "cd /tapdata/apps/lib && for j in /tapdata/apps/dist/*.jar; do echo \">> deploying $j\"; timeout 180 java \"-Dtapdata_proxy_mongodb_uri=mongodb://#{ #steps['create_mongo'].outputs['username'] }:#{ #steps['create_mongo'].outputs['password'] }@#{ #steps['create_mongo'].outputs['internal_host'] }:#{ #steps['create_mongo'].outputs['internal_port'] }/#{ #steps['create_mongo'].outputs['database'] }?authSource=admin\" -jar pdk-deploy.jar register -a 3324cfdf-7d3e-4792-bd32-571638d4562f -t http://tapdata-server-svr.tapdata-l3-f04.svc.cluster.local:3030 \"$j\" 2>&1 | tail -5; done; curl -s -m 15 -o /dev/null -w \"init_http:%{http_code}\" http://tapdata-server-svr.tapdata-l3-f04.svc.cluster.local:3030/api/init; echo; echo DEPLOY_DONE"
      expect_stdout_contains: "DEPLOY_DONE"
    timeout_seconds: 620

  # ============================================================
  # 10. 并行创建源/目标 MySQL
  # ============================================================
  - parallel:
      - id: "create_src_db"
        action: "dbforge_create_database"
        timeout_seconds: 300
        inputs:
          db_type: "mysql"
          mode: "dedicated"
          topology: "single"
        outputs: [lease_id, db_name, host, internal_host, port, database, username, password, jdbc_url]

      - id: "create_tgt_db"
        action: "dbforge_create_database"
        timeout_seconds: 300
        inputs:
          db_type: "mysql"
          mode: "dedicated"
          topology: "single"
        outputs: [lease_id, db_name, host, internal_host, port, database, username, password, jdbc_url]

  # ============================================================
  # 11. 注册数据源
  # ============================================================
  - id: "create_src_datasource"
    action: "tm_create_datasource"
    timeout_seconds: 360
    inputs:
      name: "L3_F04_SRC"
      database_type: "Mysql"
      connection_type: "source_and_target"
      database_host: "#{ #steps['create_src_db'].outputs['internal_host'] }"
      database_port: "#{ #steps['create_src_db'].outputs['internal_port'] }"
      database_username: "#{ #steps['create_src_db'].outputs['username'] }"
      database_password: "#{ #steps['create_src_db'].outputs['password'] }"
      database_name: "#{ #steps['create_src_db'].outputs['database'] }"
    outputs: [connection_id]

  - id: "create_tgt_datasource"
    action: "tm_create_datasource"
    timeout_seconds: 360
    inputs:
      name: "L3_F04_TGT"
      database_type: "Mysql"
      connection_type: "source_and_target"
      database_host: "#{ #steps['create_tgt_db'].outputs['internal_host'] }"
      database_port: "#{ #steps['create_tgt_db'].outputs['internal_port'] }"
      database_username: "#{ #steps['create_tgt_db'].outputs['username'] }"
      database_password: "#{ #steps['create_tgt_db'].outputs['password'] }"
      database_name: "#{ #steps['create_tgt_db'].outputs['database'] }"
    outputs: [connection_id]

  # ============================================================
  # 12. 初始化源库
  # ============================================================
  - id: "init_source"
    action: "jdbc_init_source"
    timeout_seconds: 180
    extra_deps:
      - "com.mysql:mysql-connector-j:8.3.0"
    inputs:
      jdbc_url: "#{ #steps['create_src_db'].outputs['jdbc_url'] }"
      username: "#{ #steps['create_src_db'].outputs['username'] }"
      password: "#{ #steps['create_src_db'].outputs['password'] }"
      table_names: ["l3f04_orders", "l3f04_users"]
      column_defs:
        - { name: "name", type: "VARCHAR(100)" }
        - { name: "amount", type: "BIGINT" }
      rows_per_table: 200
      drop_if_exists: true
    outputs: [table_names, total_rows, tables_created]

  # ============================================================
  # 13. 连接测试
  # ============================================================
  - id: "test_connections"
    action: "tm_test_connection"
    timeout_seconds: 120
    inputs:
      connection_ids:
        - "#{ #steps['create_src_datasource'].outputs['connection_id'] }"
        - "#{ #steps['create_tgt_datasource'].outputs['connection_id'] }"
      poll_interval_ms: 2000
      wait_timeout_seconds: 60
    outputs: [status, results]

  # ============================================================
  # 14. 创建并启动复制任务，等待全量+增量就绪
  # ============================================================
  - id: "create_sync_task"
    action: "tm_create_task"
    keep_alive: false
    timeout_seconds: 120
    inputs:
      name: "L3_F04_VDC_E2E"
      sync_type: "sync"
      source_connection_id: "#{ #steps['create_src_datasource'].outputs['connection_id'] }"
      target_connection_id: "#{ #steps['create_tgt_datasource'].outputs['connection_id'] }"
      source_tables: "#{ #steps['init_source'].outputs['table_names'] }"
    outputs: [task_id, sync_type]

  - id: "start_sync_task"
    action: "tm_start_task"
    timeout_seconds: 60
    inputs:
      task_id: "#{ #steps['create_sync_task'].outputs['task_id'] }"

  - id: "wait_cdc"
    action: "tm_wait_task"
    timeout_seconds: 700
    inputs:
      task_id: "#{ #steps['create_sync_task'].outputs['task_id'] }"
      # 必须等 "running"（任务运行中）而不是 "complete"：
      # VDC 校验需要任务处于运行态才能被调度；任务 complete 后 inspect 会一直停在 scheduling。
      # 全量落库是否完成由后面的 assert_jdbc_data 独立断言。
      target_status: "running"
      poll_interval_ms: 5000
      wait_timeout_seconds: 600
    outputs: [final_status, reached_target]

  # ============================================================
  # 15. 断言全量落库完成
  # ============================================================
  - id: "wait_full_table0"
    action: "assert_jdbc_data"
    timeout_seconds: 240
    inputs:
      jdbc_url: "#{ #steps['create_tgt_db'].outputs['jdbc_url'] }"
      username: "#{ #steps['create_tgt_db'].outputs['username'] }"
      password: "#{ #steps['create_tgt_db'].outputs['password'] }"
      sql: "SELECT COUNT(*) AS cnt FROM l3f04_orders"
      assert_mode: "value_equals"
      column: "cnt"
      expected: 200
      poll_interval: 5
      max_attempts: 36

  - id: "wait_full_table1"
    action: "assert_jdbc_data"
    timeout_seconds: 240
    inputs:
      jdbc_url: "#{ #steps['create_tgt_db'].outputs['jdbc_url'] }"
      username: "#{ #steps['create_tgt_db'].outputs['username'] }"
      password: "#{ #steps['create_tgt_db'].outputs['password'] }"
      sql: "SELECT COUNT(*) AS cnt FROM l3f04_users"
      assert_mode: "value_equals"
      column: "cnt"
      expected: 200
      poll_interval: 5
      max_attempts: 36

  # ============================================================
  # 16. 创建 VDC 校验任务（value 全字段校验）
  # ============================================================
  - id: "create_inspect"
    action: "tm_create_inspect"
    keep_alive: false
    timeout_seconds: 120
    inputs:
      name: "L3_F04_VDC"
      task_id: "#{ #steps['create_sync_task'].outputs['task_id'] }"
      source_connection_id: "#{ #steps['create_src_datasource'].outputs['connection_id'] }"
      target_connection_id: "#{ #steps['create_tgt_datasource'].outputs['connection_id'] }"
      tables: "#{ #steps['init_source'].outputs['table_names'] }"
      inspect_mode: "all"
      inspect_method: "value"
      inspect_difference_mode: "All"
      # MySQL 表主键是 id（镜像默认 _id 属于 MongoDB），不指定会让 inspect 直接 status=error
      sort_column: "id"
    outputs: [inspect_id]

  # ============================================================
  # 17. 基线校验：必须完全一致
  # ============================================================
  - id: "run_inspect_baseline"
    action: "tm_execute_inspect"
    timeout_seconds: 300
    inputs:
      inspect_id: "#{ #steps['create_inspect'].outputs['inspect_id'] }"
    outputs: [status, mismatched_tables, mismatched_rows, success]

  - id: "assert_baseline_consistent"
    action: "tm_assert_inspect_result"
    timeout_seconds: 60
    inputs:
      inspect_id: "#{ #steps['create_inspect'].outputs['inspect_id'] }"
      allow_mismatch: false

  # ============================================================
  # 18. 造差异：目标端旁路修改一条源端不存在的值
  #     用 UPDATE 而非 INSERT —— value 模式按源端行比对字段值，
  #     目标端多出的整行不会被计入差异，改值才能稳定检出。
  # ============================================================
  - id: "inject_mismatch"
    action: "dbforge_execute_sql"
    timeout_seconds: 90
    inputs:
      jdbc_url: "#{ #steps['create_tgt_db'].outputs['jdbc_url'] }"
      username: "#{ #steps['create_tgt_db'].outputs['username'] }"
      password: "#{ #steps['create_tgt_db'].outputs['password'] }"
      sql: "UPDATE l3f04_orders SET amount = amount + 1000000 WHERE id = 1;"
    outputs: [affected_rows]

  # ============================================================
  # 19. 负向断言：再次校验必须能检出差异
  #     （校验能力失效 / 结果解析失效时该 step 会因「未失败」而判失败，避免假通过）
  # ============================================================
  - id: "run_inspect_drift"
    action: "tm_execute_inspect"
    timeout_seconds: 300
    inputs:
      inspect_id: "#{ #steps['create_inspect'].outputs['inspect_id'] }"
    outputs: [status, mismatched_tables, mismatched_rows, success]

  - id: "assert_drift_detected"
    action: "tm_assert_inspect_result"
    timeout_seconds: 60
    expect_failure: true
    expect_failure_message: "mismatched"
    inputs:
      inspect_id: "#{ #steps['create_inspect'].outputs['inspect_id'] }"
      allow_mismatch: false

  # ============================================================
  # 20. 修复：删除脏数据
  # ============================================================
  - id: "repair_mismatch"
    action: "dbforge_execute_sql"
    timeout_seconds: 90
    inputs:
      jdbc_url: "#{ #steps['create_tgt_db'].outputs['jdbc_url'] }"
      username: "#{ #steps['create_tgt_db'].outputs['username'] }"
      password: "#{ #steps['create_tgt_db'].outputs['password'] }"
      sql: "DELETE FROM l3f04_orders WHERE id = 999999901;"
    outputs: [affected_rows]

  # ============================================================
  # 21. 恢复校验：必须重新完全一致
  # ============================================================
  - id: "run_inspect_recovered"
    action: "tm_execute_inspect"
    timeout_seconds: 300
    inputs:
      inspect_id: "#{ #steps['create_inspect'].outputs['inspect_id'] }"
    outputs: [status, mismatched_tables, mismatched_rows, success]

  - id: "assert_recovered_consistent"
    action: "tm_assert_inspect_result"
    timeout_seconds: 60
    inputs:
      inspect_id: "#{ #steps['create_inspect'].outputs['inspect_id'] }"
      allow_mismatch: false

  # ============================================================
  # 22. 收尾：卸载 TapData 集群
  # ============================================================
  - id: "cleanup"
    action: "undeploy_tapdata"
    inputs:
      namespace: "tapdata-l3-f04"
      helm_release: "tapdata"
      host: "localhost"
      cancel_pending_cleanups: true
    timeout_seconds: 300
