case_id: "L3-HA-ENGINE-FAILOVER"
scenario: "TapData K8s HA — 2 TM + 2 Engine + 2 ApiServer，停止运行任务的 Engine 后任务自动故障转移"
group: "functional"
description: >-
  HA 故障转移端到端场景：
  (1) dbforge 创建 TapData MongoDB 中间库 + 部署 2 TM / 2 Engine / 2 ApiServer 多节点集群；
  (2) 调小任务心跳超时 jobHeartTimeout（生效阈值 = value × 2），加速故障转移判定；
  (3) dbforge 创建源/目标两个 MySQL，初始化源库表和数据；
  (4) 创建数据复制任务（全量+增量），等待进入增量（CDC）阶段；
  (5) 通过 TM 查询任务当前运行的 engine（Workers.hostname 即 K8s Pod 名），删除该 Pod 制造故障；
  (6) 等待心跳超时后任务被 TM 重新调度到另一个 engine（等待时长 > 心跳超时）；
  (7) 源库写入增量数据，等待同步完成，VDC 校验源/目标数据一致；
  (8) 收尾：校验 Engine Deployment 自愈回 2 副本，卸载集群，释放全部 dbforge 租约。

# 说明：
# - TM API 通过 kubectl patch svc → NodePort 30303 暴露。L3 runner 所在宿主机 (192.168.1.184)
#   不是 K8s 节点，NodePort 只在节点 IP 上可达，因此 TM_BASE_URL 用 control-plane 节点 IP。
#   DSL env 注入 System Properties，优先级高于 ~/.tapdata-tm。
# - access_code 不显式设置：全新部署的 TapData 使用产品默认 accessCode
#   （3324cfdf-7d3e-4792-bd32-571638d4562f，与 TmClient 默认值一致）。
env:
  TM_BASE_URL: "http://192.168.1.193:30303"

steps:
  # ============================================================
  # 0. 申请 License（engine_limit 放宽到 5：2 个 engine + 故障后重建的 Pod 会注册新 worker）
  # ============================================================
  - id: "fetch_license"
    action: "get_license"
    inputs:
      base_url: "http://192.168.1.184:18080"
      username: "license-temp"
      password: "Gotapd8!"
      customer: "tapdata-it"
      reason: "L3 HA engine failover e2e test"
      valid_days: 30
      version: "4.25.0"
      license_type: "OP"
      engine_limit: 5
    outputs: [license]
    timeout_seconds: 60

  # ============================================================
  # 1. dbforge 创建 TapData MongoDB 中间库（replica set，多 TM 需要 change stream）
  # ============================================================
  - id: "create_mongo"
    action: "dbforge_create_database"
    inputs:
      db_type: "mongodb"
      mode: "dedicated"
      topology: "replicaset"
    outputs: [lease_id, uri, host, internal_host, port, database, username, password]
    timeout_seconds: 300

  # ============================================================
  # 2. 在租约 MongoDB 的 admin 库补建同名用户
  #    （dbforge 租约用户只创建在租约库下，但 TM 镜像 entrypoint 固定用
  #      authenticationDatabase=admin 认证 — 需在 admin 库补建同名用户，
  #      并授予其对租约库的 dbOwner；TM 元数据落在租约库中）
  # ============================================================
  - id: "grant_mongo_admin_user"
    action: "exec"
    inputs:
      host: "localhost"
      namespace: "dbforge-env-ephemeral"
      pod: "#{ #steps['create_mongo'].outputs['lease_id'] }-0"
      container: "mongodb"
      command: "mongosh -u \"$MONGODB_INITDB_ROOT_USERNAME\" -p \"$MONGODB_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --quiet --eval \"try { db.getSiblingDB('admin').createUser({user:'#{ #steps['create_mongo'].outputs['username'] }',pwd:'#{ #steps['create_mongo'].outputs['password'] }',roles:[{role:'dbOwner',db:'#{ #steps['create_mongo'].outputs['database'] }'}]}); print('GRANT_OK created'); } catch(e) { if (e.message.includes('already exists')) { print('GRANT_OK exists'); } else { throw e; } }\""
      expect_stdout_contains: "GRANT_OK"
    timeout_seconds: 60

  # ============================================================
  # 3. 部署多节点 TapData：2 TM + 2 Engine + 2 ApiServer
  #    TM/Engine 通过 svc 全域名互访；MongoDB 用 step1 的 dbforge 租约（内网地址，Pod 可达）
  #    认证走 admin 库（上一步已补建用户），TM 元数据库为租约 database
  # ============================================================
  - id: "deploy_ha"
    action: "deploy_tapdata"
    inputs:
      host: "localhost"
      prebuilt_image: "192.168.1.184:5001/tapdata/tapdata-enterprise:latest"
      harbor_registry: "192.168.1.184:5001"
      # mongodb_hosts 省略 — deploy_tapdata 会从 mongodb_uri 自动提取 host:port
      mongodb_uri: "mongodb://#{ #steps['create_mongo'].outputs['username'] }:#{ #steps['create_mongo'].outputs['password'] }@#{ #steps['create_mongo'].outputs['internal_host'] }:#{ #steps['create_mongo'].outputs['internal_port'] }/#{ #steps['create_mongo'].outputs['database'] }?authSource=admin"
      mongodb_user: "#{ #steps['create_mongo'].outputs['username'] }"
      mongodb_password: "#{ #steps['create_mongo'].outputs['password'] }"
      mongodb_database: "#{ #steps['create_mongo'].outputs['database'] }"
      mongodb_auth_source: "admin"
      namespace: "tapdata-ha"
      # TM 先 1 副本启动：全新元数据库上多 TM 并发启动会竞争执行 DB 迁移补丁
      # （daas_script_version Duplicate key）导致循环崩溃；迁移完成后再扩容到 2
      server_replicas: 1
      # engine 先 0 副本：entrypoint 解出 connectors/dist 后，若登录 TM 失败，
      # 镜像内的定时清理会把 dist 清空，之后即使登录恢复也无 connector 可注册。
      # 等 align_access_code 修好占位符 accessCode 后再扩容，保证 engine 起来即可登录
      engine_replicas: 0
      apiserver_replicas: 2
      backend_url: "http://tapdata-server-svr.tapdata-ha.svc.cluster.local:3030/api/"
      license_host: "192.168.1.184:18080"
      license: "#{ #steps['fetch_license'].outputs['license'] }"
    outputs: [namespace, helmRelease]
    # TM 冷启动实测 8~13 分钟，900s 不够
    timeout_seconds: 1500

  # ============================================================
  # 3. 暴露 TM API：patch tapdata-server-svr → NodePort 30303
  #    （L3 runner 在宿主机上通过 localhost:30303 访问 TM）
  # ============================================================
  - id: "expose_tm_nodeport"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      command: "patch svc tapdata-server-svr --type=merge -p '{\"spec\":{\"type\":\"NodePort\",\"ports\":[{\"port\":3030,\"targetPort\":3030,\"nodePort\":30303,\"protocol\":\"TCP\"}]}}'"
      expect_stdout_contains: "patched"
    timeout_seconds: 60

  # ============================================================
  # 4. 等待 1 副本 TM + 2 副本 Engine/ApiServer Ready
  # ============================================================
  - id: "tm_replicas_1"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      command: "get deploy tapdata-tapdata-server -o jsonpath='{.status.readyReplicas}'"
      expect_stdout_equals: "1"
      max_attempts: 90
      poll_interval_seconds: 5
    timeout_seconds: 500

  - id: "engine_replicas_0"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      command: "get deploy tapdata-tapdata-engine -o jsonpath='{.spec.replicas}'"
      expect_stdout_equals: "0"
      max_attempts: 60
      poll_interval_seconds: 5
    timeout_seconds: 400

  - id: "apiserver_replicas_2"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      command: "get deploy tapdata-tapdata-apiserver -o jsonpath='{.status.readyReplicas}'"
      expect_stdout_equals: "2"
      max_attempts: 60
      poll_interval_seconds: 5
    timeout_seconds: 400

  # ============================================================
  # 5. 登录 TM（K8s Ready 不代表 TM 应用就绪 — 轮询等待直到拿到 token）
  # ============================================================
  - id: "login_tm"
    action: "tm_login"
    inputs:
      wait_timeout_seconds: 300
      poll_interval_ms: 5000
    outputs: [access_token, tm_base_url]
    timeout_seconds: 360

  # ============================================================
  # 5a. 对齐 accessCode：镜像 application.yml 里 accessCode 固定为占位符
  #     <ACCESS_CODE>（engine/apiserver 按原文发送），而 TM 初始化用户用的是
  #     CLI 内置默认 3324cfdf-...。直接把 User 集合里的 accessCode 改成占位符，
  #     让 engine/apiserver/TM 内部调用都能登录。已签发的 token 不受影响。
  # ============================================================
  - id: "align_access_code"
    action: "exec"
    inputs:
      host: "localhost"
      namespace: "dbforge-env-ephemeral"
      pod: "#{ #steps['create_mongo'].outputs['lease_id'] }-0"
      container: "mongodb"
      command: "mongosh -u \"$MONGODB_INITDB_ROOT_USERNAME\" -p \"$MONGODB_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --quiet --eval \"var dbx=db.getSiblingDB('#{ #steps['create_mongo'].outputs['database'] }'); var done=0; ['User','users'].forEach(function(c){ if(done===0){ var col=dbx.getCollection(c); if(col.countDocuments({\\$or:[{accesscode:'<ACCESS_CODE>'},{accessCode:'<ACCESS_CODE>'}]})>0){ done=1; return; } var u=col.findOne({\\$or:[{accesscode:'3324cfdf-7d3e-4792-bd32-571638d4562f'},{accessCode:'3324cfdf-7d3e-4792-bd32-571638d4562f'}]}); if(u){ u._id=new ObjectId(); delete u.accessCode; u.accesscode='<ACCESS_CODE>'; u.email='admin-ha@tapdata.io'; if(u.username){ u.username='admin-ha'; } col.insertOne(u); done=1; } } }); print('ALIGN_OK inserted='+done);\""
      expect_stdout_contains: "ALIGN_OK inserted=1"
    timeout_seconds: 60

  # ============================================================
  # 5b. TM 应用就绪后扩容到 2 副本（构成 HA），等待第二个 TM Ready
  # ============================================================
  - id: "scale_tm_to_2"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      command: "scale deploy tapdata-tapdata-server --replicas=2"
      expect_stdout_contains: "scaled"
    timeout_seconds: 60

  - id: "tm_replicas_2"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      command: "get deploy tapdata-tapdata-server -o jsonpath='{.status.readyReplicas}'"
      expect_stdout_equals: "2"
      max_attempts: 90
      poll_interval_seconds: 5
    timeout_seconds: 500

  # ============================================================
  # 5c. accessCode 已对齐，扩容 engine 到 2 副本（HA）并等待 Ready
  #     — 全新 Pod 会重新解出 connectors/dist，登录成功后向 TM 注册 connector
  # ============================================================
  - id: "scale_engine_to_2"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      command: "scale deploy tapdata-tapdata-engine --replicas=2"
      expect_stdout_contains: "scaled"
    timeout_seconds: 60

  - id: "engine_replicas_2"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      command: "get deploy tapdata-tapdata-engine -o jsonpath='{.status.readyReplicas}'"
      expect_stdout_equals: "2"
      max_attempts: 90
      poll_interval_seconds: 5
    timeout_seconds: 500

  # ============================================================
  # 5d. 向 TM 注册 connector（生成 DatabaseTypes / pdkHash）：
  #     直接调用镜像内的 java 部署器 pdk-deploy.jar（这也是 CLI deployConnector
  #     子系统最终走的路径；node 封装的 worker 在本环境连错 mongo 会静默 0/3）。
  #     -a 传 TM 初始管理员的 accesscode（3324cfdf，与 login_tm 同一身份），
  #     -t 传 TM backend 地址，-Dtapdata_proxy_mongodb_uri 传中间库完整 URI。
  #     注册后调用 /api/init 触发 TM 重载（CLI worker 的标准收尾动作）。
  #     验证点：后续 create_*_datasource 的 pdkHash 轮询（等 DatabaseTypes 出现 Mysql）。
  # ============================================================
  - id: "deploy_connectors"
    action: "exec"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      pod: "tapdata-tapdata-engine"
      command: "cd /tapdata/apps/lib && for j in /tapdata/apps/dist/*.jar; do echo \">> deploying $j\"; timeout 180 java \"-Dtapdata_proxy_mongodb_uri=mongodb://#{ #steps['create_mongo'].outputs['username'] }:#{ #steps['create_mongo'].outputs['password'] }@#{ #steps['create_mongo'].outputs['internal_host'] }:#{ #steps['create_mongo'].outputs['internal_port'] }/#{ #steps['create_mongo'].outputs['database'] }?authSource=admin\" -jar pdk-deploy.jar register -a 3324cfdf-7d3e-4792-bd32-571638d4562f -t http://tapdata-server-svr.tapdata-ha.svc.cluster.local:3030 \"$j\" 2>&1 | tail -5; done; curl -s -m 15 -o /dev/null -w \"init_http:%{http_code}\" http://tapdata-server-svr.tapdata-ha.svc.cluster.local:3030/api/init; echo; echo DEPLOY_DONE"
      expect_stdout_contains: "DEPLOY_DONE"
    timeout_seconds: 620

  # ============================================================
  # 6. 调小任务心跳超时：jobHeartTimeout = 60s
  #    （TM 判定任务失联的阈值 = jobHeartTimeout × 2 = 120s，
  #      之后才会把任务重新调度到其他 engine）
  # ============================================================
  - id: "tune_heartbeat_timeout"
    action: "tm_update_setting"
    inputs:
      key: "jobHeartTimeout"
      value: "60000"
    outputs: [setting_id, operation]
    timeout_seconds: 60

  # ============================================================
  # 7. 并行创建源/目标两个 MySQL（互相独立，无交叉引用）
  # ============================================================
  - parallel:
      - id: "create_src_db"
        action: "dbforge_create_database"
        timeout_seconds: 300
        inputs:
          db_type: "mysql"
          mode: "dedicated"
          topology: "single"
        outputs: [lease_id, db_name, host, internal_host, port, database, username, password, jdbc_url]

      - id: "create_tgt_db"
        action: "dbforge_create_database"
        timeout_seconds: 300
        inputs:
          db_type: "mysql"
          mode: "dedicated"
          topology: "single"
        outputs: [lease_id, db_name, host, internal_host, port, database, username, password, jdbc_url]

  # ============================================================
  # 8. 在 TM 上注册源/目标数据源
  #    （不传 agent_id — 全新集群所有 agent 均存活，由 TM 自动分配连接测试 agent；
  #      database_host 用内网地址，engine Pod 经节点内网出口可达）
  # ============================================================
  - id: "create_src_datasource"
    action: "tm_create_datasource"
    timeout_seconds: 360
    inputs:
      name: "L3_HA_SRC"
      database_type: "Mysql"
      connection_type: "source_and_target"
      database_host: "#{ #steps['create_src_db'].outputs['internal_host'] }"
      database_port: "#{ #steps['create_src_db'].outputs['internal_port'] }"
      database_username: "#{ #steps['create_src_db'].outputs['username'] }"
      database_password: "#{ #steps['create_src_db'].outputs['password'] }"
      database_name: "#{ #steps['create_src_db'].outputs['database'] }"
    outputs: [connection_id]

  - id: "create_tgt_datasource"
    action: "tm_create_datasource"
    timeout_seconds: 360
    inputs:
      name: "L3_HA_TGT"
      database_type: "Mysql"
      connection_type: "source_and_target"
      database_host: "#{ #steps['create_tgt_db'].outputs['internal_host'] }"
      database_port: "#{ #steps['create_tgt_db'].outputs['internal_port'] }"
      database_username: "#{ #steps['create_tgt_db'].outputs['username'] }"
      database_password: "#{ #steps['create_tgt_db'].outputs['password'] }"
      database_name: "#{ #steps['create_tgt_db'].outputs['database'] }"
    outputs: [connection_id]

  # ============================================================
  # 9. 初始化源库数据（自动建 2 张表，每表 200 行）
  # ============================================================
  - id: "init_source"
    action: "jdbc_init_source"
    timeout_seconds: 180
    extra_deps:
      - "com.mysql:mysql-connector-j:8.3.0"
    inputs:
      jdbc_url: "#{ #steps['create_src_db'].outputs['jdbc_url'] }"
      username: "#{ #steps['create_src_db'].outputs['username'] }"
      password: "#{ #steps['create_src_db'].outputs['password'] }"
      table_count: 2
      columns_per_table: 5
      rows_per_table: 200
      drop_if_exists: true
    outputs: [table_names, total_rows, tables_created]

  # ============================================================
  # 10. 测试数据源连接（确保 ready 再建任务）
  # ============================================================
  - id: "test_connections"
    action: "tm_test_connection"
    timeout_seconds: 120
    inputs:
      connection_ids:
        - "#{ #steps['create_src_datasource'].outputs['connection_id'] }"
        - "#{ #steps['create_tgt_datasource'].outputs['connection_id'] }"
      poll_interval_ms: 2000
      wait_timeout_seconds: 60
    outputs: [status, results]

  # ============================================================
  # 11. 创建数据复制任务（全量+增量；不传 agent_id，TM 自动调度到某个 engine）
  # ============================================================
  - id: "create_sync_task"
    action: "tm_create_task"
    keep_alive: false
    timeout_seconds: 120
    inputs:
      name: "L3_HA_MySQL_Replication"
      sync_type: "sync"
      source_connection_id: "#{ #steps['create_src_datasource'].outputs['connection_id'] }"
      target_connection_id: "#{ #steps['create_tgt_datasource'].outputs['connection_id'] }"
      source_tables: "#{ #steps['init_source'].outputs['table_names'] }"
    outputs: [task_id, sync_type]

  # ============================================================
  # 12. 启动任务
  # ============================================================
  - id: "start_sync_task"
    action: "tm_start_task"
    timeout_seconds: 60
    inputs:
      task_id: "#{ #steps['create_sync_task'].outputs['task_id'] }"

  # ============================================================
  # 13. 等待任务进入增量（全量完成，CDC 里程碑就绪）
  # ============================================================
  - id: "wait_cdc"
    action: "tm_wait_task"
    timeout_seconds: 700
    inputs:
      task_id: "#{ #steps['create_sync_task'].outputs['task_id'] }"
      target_status: "complete"
      poll_interval_ms: 5000
      wait_timeout_seconds: 600
    outputs: [final_status, reached_target]

  # ============================================================
  # 14. 通过 TM 查询任务当前运行在哪个 engine 上
  #     （Workers.hostname = K8s engine Pod 名）
  # ============================================================
  - id: "locate_engine"
    action: "tm_get_task_engine"
    timeout_seconds: 60
    inputs:
      task_id: "#{ #steps['create_sync_task'].outputs['task_id'] }"
    outputs: [agent_id, hostname, worker_status]

  # ============================================================
  # 15. 制造故障：删除正在运行任务的 engine Pod
  # ============================================================
  - id: "stop_task_engine"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      command: "delete pod #{ #steps['locate_engine'].outputs['hostname'] } --wait=false"
      expect_stdout_contains: "deleted"
    timeout_seconds: 120

  # ============================================================
  # 16. 等待任务故障转移到另一个 engine
  #     （等待 300s > 生效心跳超时 120s = jobHeartTimeout 60s × 2）
  # ============================================================
  - id: "wait_failover"
    action: "tm_wait_task_failover"
    timeout_seconds: 360
    inputs:
      task_id: "#{ #steps['create_sync_task'].outputs['task_id'] }"
      previous_agent_id: "#{ #steps['locate_engine'].outputs['agent_id'] }"
      wait_timeout_seconds: 300
      poll_interval_ms: 5000
    outputs: [new_agent_id, new_hostname, elapsed_seconds]

  # ============================================================
  # 17. 源库写入增量数据（故障转移后，由新 engine 继续同步）
  # ============================================================
  - id: "write_incremental"
    action: "jdbc_write_incremental"
    timeout_seconds: 120
    extra_deps:
      - "com.mysql:mysql-connector-j:8.3.0"
    inputs:
      jdbc_url: "#{ #steps['create_src_db'].outputs['jdbc_url'] }"
      username: "#{ #steps['create_src_db'].outputs['username'] }"
      password: "#{ #steps['create_src_db'].outputs['password'] }"
      table_name: "#{ #steps['init_source'].outputs['table_names'][0] }"
      use_transaction: true
      operation_counts:
        insert: 10
        update: 20
        delete: 50
    outputs: [total_operations, operations_insert, operations_update, operations_delete]

  # ============================================================
  # 18. 等待增量数据同步完成（轮询目标库行数直至与源库一致）
  #     table[0]: 200 + 10 - 50 = 160 行；table[1]: 200 行不变
  # ============================================================
  - id: "wait_incr_table0"
    action: "assert_jdbc_data"
    timeout_seconds: 240
    inputs:
      jdbc_url: "#{ #steps['create_tgt_db'].outputs['jdbc_url'] }"
      username: "#{ #steps['create_tgt_db'].outputs['username'] }"
      password: "#{ #steps['create_tgt_db'].outputs['password'] }"
      sql: "SELECT COUNT(*) AS cnt FROM #{ #steps['init_source'].outputs['table_names'][0] }"
      assert_mode: "value_equals"
      column: "cnt"
      expected: 160
      poll_interval: 5
      max_attempts: 36

  - id: "wait_incr_table1"
    action: "assert_jdbc_data"
    timeout_seconds: 240
    inputs:
      jdbc_url: "#{ #steps['create_tgt_db'].outputs['jdbc_url'] }"
      username: "#{ #steps['create_tgt_db'].outputs['username'] }"
      password: "#{ #steps['create_tgt_db'].outputs['password'] }"
      sql: "SELECT COUNT(*) AS cnt FROM #{ #steps['init_source'].outputs['table_names'][1] }"
      assert_mode: "value_equals"
      column: "cnt"
      expected: 200
      poll_interval: 5
      max_attempts: 36

  # ============================================================
  # 19. VDC 全字段一致性校验（pinned 到故障转移后的新 engine）
  # ============================================================
  - id: "create_inspect"
    action: "tm_create_inspect"
    keep_alive: false
    timeout_seconds: 120
    inputs:
      name: "L3_HA_VDC"
      task_id: "#{ #steps['create_sync_task'].outputs['task_id'] }"
      agent_id: "#{ #steps['wait_failover'].outputs['new_agent_id'] }"
      source_connection_id: "#{ #steps['create_src_datasource'].outputs['connection_id'] }"
      target_connection_id: "#{ #steps['create_tgt_datasource'].outputs['connection_id'] }"
      tables: "#{ #steps['init_source'].outputs['table_names'] }"
      inspect_mode: "all"
      # MySQL 表主键是 id（镜像默认 _id 属于 MongoDB）
      sort_column: "id"
    outputs: [inspect_id]

  - id: "run_inspect"
    action: "tm_execute_inspect"
    timeout_seconds: 300
    inputs:
      inspect_id: "#{ #steps['create_inspect'].outputs['inspect_id'] }"
    outputs: [status, mismatched_tables, mismatched_rows, success]

  - id: "assert_data_consistent"
    action: "tm_assert_inspect_result"
    timeout_seconds: 60
    inputs:
      inspect_id: "#{ #steps['create_inspect'].outputs['inspect_id'] }"
      allow_mismatch: false

  # ============================================================
  # 20. 校验 Engine Deployment 自愈回 2 副本
  # ============================================================
  - id: "engine_self_heal"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      command: "get deploy tapdata-tapdata-engine -o jsonpath='{.status.readyReplicas}'"
      expect_stdout_equals: "2"
      max_attempts: 60
      poll_interval_seconds: 5
    timeout_seconds: 400

  # ============================================================
  # 21. 收尾：卸载 TapData 集群
  #     （dbforge 租约 / TM 任务 / 数据源 / Inspect 由框架 LIFO 自动清理）
  # ============================================================
  - id: "cleanup"
    action: "undeploy_tapdata"
    inputs:
      namespace: "tapdata-ha"
      helm_release: "tapdata"
      host: "localhost"
      # 本场景的 TM 资源（任务/连接/校验）创建在本环境的 TM 上 — 环境已卸载，
      # 取消挂起的 "tm" 清理钩子，避免清理阶段对已消失的 TM 逐个重试（即使有熔断也要等 ~1min）
      cancel_pending_cleanups: true
    timeout_seconds: 300
