case_id: "L3-DEPLOY-TAPDATA-HA"
scenario: "TapData K8s HA — 2 TM + 2 Engine + 2 ApiServer"
group: "functional"
description: >-
  Verify TapData deploy on K8s matches expectations:
  (1) 2 TM / 2 Engine / 2 ApiServer replicas all ready;
  (2) Engine & ApiServer reach TM via K8s service local domain
      (tapdata-server-svr.<ns>.svc.cluster.local);
  (3) stop a specified TM pod / a specified Engine pod, and the Deployment self-heals.

steps:
  # ============================================================
  # 0. 向 License Server 申请 License
  # ============================================================
  - id: "fetch_license"
    action: "get_license"
    inputs:
      base_url: "http://192.168.1.184:18080"
      username: "license-temp"
      password: "Gotapd8!"
      customer: "tapdata-it"
      reason: "L3 HA e2e test"
      valid_days: 30
      version: "4.23.0"
      license_type: "OP"
      engine_limit: 3
    outputs: [license]
    timeout_seconds: 60

  # ============================================================
  # 1. 部署：2 TM + 2 Engine + 2 ApiServer
  # ============================================================
  - id: "deploy_ha"
    action: "deploy_tapdata"
    inputs:
      host: "localhost"
      prebuilt_image: "192.168.1.184:5001/tapdata/tapdata-enterprise:latest"
      harbor_registry: "192.168.1.184:5001"
      mongodb_uri: "mongodb://root:AbcDef123@mongo60-rs-headless.tapdata-db.svc.cluster.local:27017/tapdata?replicaSet=rs0&authSource=admin"
      mongodb_hosts: "mongo60-rs-0.mongo60-rs-headless.tapdata-db.svc.cluster.local:27017,mongo60-rs-1.mongo60-rs-headless.tapdata-db.svc.cluster.local:27017,mongo60-rs-2.mongo60-rs-headless.tapdata-db.svc.cluster.local:27017"
      mongodb_user: "root"
      mongodb_password: "AbcDef123"
      namespace: "tapdata-ha"
      server_replicas: 2
      engine_replicas: 2
      apiserver_replicas: 2
      # Engine / ApiServer 通过 K8s svc 全域名访问 TM
      backend_url: "http://tapdata-server-svr.tapdata-ha.svc.cluster.local:3030/api/"
      license_host: "192.168.1.184:18080"
      license: "#{ #steps['fetch_license'].outputs['license'] }"
    outputs: [namespace, helmRelease]
    # helm --wait 最大 900s（chart startupProbe 窗口，TM 冷启动实测约 7~8 分钟），留出余量
    timeout_seconds: 1500

  # ============================================================
  # 1.5 License 快速失败检查
  #     TM 启动后若 License 无效/过期，Spring 会主动 graceful shutdown，
  #     manager 日志文件（/tapdata/apps/logs/manager/*.log）会出现
  #     "License is expired"，随后 3030 端口关闭、Pod 无法 Ready。
  #     此步骤在部署后立即 exec 到 TM Pod 读取 manager 日志，
  #     命中即 fail，避免后续断言无意义等待。
  # ============================================================
  - id: "tm_license_not_expired"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      # kubectl exec 不支持 -l/--selector（v1.35+），用子命令取首个 TM server pod 名
      command: "exec $(kubectl -n tapdata-ha get pods -l app.kubernetes.io/name=tapdata-server -o jsonpath='{.items[0].metadata.name}') -- sh -c 'grep -h \"License is expired\" /tapdata/apps/logs/manager/*.log 2>/dev/null; true'"
      expect_stdout_not_contains: "License is expired"
      max_attempts: 12
      poll_interval_seconds: 5
    timeout_seconds: 90

  # ============================================================
  # 2. 断言：三个组件各 2 副本 Ready
  # ============================================================
  - id: "tm_replicas_2"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      command: "get deploy tapdata-tapdata-server -o jsonpath='{.status.readyReplicas}'"
      expect_stdout_equals: "2"
      max_attempts: 60
      poll_interval_seconds: 5
    timeout_seconds: 400

  - id: "engine_replicas_2"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      command: "get deploy tapdata-tapdata-engine -o jsonpath='{.status.readyReplicas}'"
      expect_stdout_equals: "2"
      max_attempts: 60
      poll_interval_seconds: 5
    timeout_seconds: 400

  - id: "apiserver_replicas_2"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      command: "get deploy tapdata-tapdata-apiserver -o jsonpath='{.status.readyReplicas}'"
      expect_stdout_equals: "2"
      max_attempts: 60
      poll_interval_seconds: 5
    timeout_seconds: 400

  # ============================================================
  # 3. 断言：Engine / ApiServer 通过 svc local domain 访问 TM
  # ============================================================
  - id: "engine_dns_tm"
    action: "exec"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      pod: "tapdata-tapdata-engine"
      command: "getent hosts tapdata-server-svr.tapdata-ha.svc.cluster.local"
      expect_stdout_contains: "tapdata-server-svr.tapdata-ha.svc.cluster.local"
    timeout_seconds: 60

  - id: "engine_backend_url"
    action: "exec"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      pod: "tapdata-tapdata-engine"
      command: "printenv BACKENDURL"
      expect_stdout_contains: "tapdata-server-svr.tapdata-ha.svc.cluster.local:3030/api/"
    timeout_seconds: 60

  - id: "apiserver_dns_tm"
    action: "exec"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      pod: "tapdata-tapdata-apiserver"
      command: "getent hosts tapdata-server-svr.tapdata-ha.svc.cluster.local"
      expect_stdout_contains: "tapdata-server-svr.tapdata-ha.svc.cluster.local"
    timeout_seconds: 60

  - id: "apiserver_backend_url"
    action: "exec"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      pod: "tapdata-tapdata-apiserver"
      command: "printenv BACKENDURL"
      expect_stdout_contains: "tapdata-server-svr.tapdata-ha.svc.cluster.local:3030/api/"
    timeout_seconds: 60

  # Engine 通过 svc 全域名实际连通 TM（HTTP 非 000 即证明 TCP+HTTP 可达）
  - id: "engine_http_tm"
    action: "exec"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      pod: "tapdata-tapdata-engine"
      # TM 服务刚 Ready 时 Java 进程还要启动 1-2 分钟，curl 需要长轮询（24×5s ≈ 2min+）
      # 注意：必须是单行命令 — YAML 折叠标量对更深缩进的行不折叠，多行 if/for 会被拆坏
      command: 'for i in $(seq 1 24); do code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://tapdata-server-svr.tapdata-ha.svc.cluster.local:3030/); echo "try $i: http_code=$code"; if [ -n "$code" ] && [ "$code" != "000" ]; then exit 0; fi; sleep 5; done; echo "TM service not reachable after 24 tries"; exit 1'
    timeout_seconds: 240

  # ============================================================
  # 3.5 License 校验：两个 TM Pod 均未发生过容器重启
  #     （License 过期/无效会导致 TM 进程退出并被 livenessProbe 反复重启）
  # ============================================================
  - id: "tm_license_ok"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      command: "get pods -l app.kubernetes.io/name=tapdata-server -o jsonpath='{.items[*].status.containerStatuses[*].restartCount}'"
      expect_stdout_equals: "0 0"
    timeout_seconds: 60

  # ============================================================
  # 4. 停止指定 TM Pod → Deployment 自愈到 2 副本
  # ============================================================
  - id: "get_tm_pod"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      command: "get pods -l app.kubernetes.io/name=tapdata-server --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}'"
      expect_stdout_contains: "tapdata-tapdata-server"
    timeout_seconds: 60

  - id: "stop_tm_pod"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      command: "delete pod #{ #steps['get_tm_pod'].outputs['stdoutTrimmed'] }"
      command_timeout_seconds: 120
    timeout_seconds: 180

  - id: "tm_self_heal"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      command: "get pods -l app.kubernetes.io/name=tapdata-server -o jsonpath='{.items[*].metadata.name}'"
      expect_stdout_not_contains: "#{ #steps['get_tm_pod'].outputs['stdoutTrimmed'] }"
      max_attempts: 60
      poll_interval_seconds: 5
    timeout_seconds: 400

  # ============================================================
  # 5. 停止指定 Engine Pod → Deployment 自愈到 2 副本
  # ============================================================
  - id: "get_engine_pod"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      command: "get pods -l app.kubernetes.io/name=tapdata-engine --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}'"
      expect_stdout_contains: "tapdata-tapdata-engine"
    timeout_seconds: 60

  - id: "stop_engine_pod"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      command: "delete pod #{ #steps['get_engine_pod'].outputs['stdoutTrimmed'] }"
      command_timeout_seconds: 120
    timeout_seconds: 180

  - id: "engine_self_heal"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-ha"
      command: "get pods -l app.kubernetes.io/name=tapdata-engine -o jsonpath='{.items[*].metadata.name}'"
      expect_stdout_not_contains: "#{ #steps['get_engine_pod'].outputs['stdoutTrimmed'] }"
      max_attempts: 60
      poll_interval_seconds: 5
    timeout_seconds: 400

  # ============================================================
  # 6. 收尾：卸载
  # ============================================================
  - id: "cleanup"
    action: "undeploy_tapdata"
    inputs:
      namespace: "tapdata-ha"
      helm_release: "tapdata"
      host: "localhost"
    timeout_seconds: 300
