# =============================================================================
# TapData L3 — Golden Path Integration Test
# =============================================================================
# End-to-end scenario: 全量同步 + 增量同步 + 数据校验
# TM 环境: http://113.98.206.140:24021
# dbforge: 默认配置 (~/.dbforge 或环境变量)
# =============================================================================

case_id: "L3-GP-MYSQL-CDC"
scenario: "Golden Path — MySQL→MySQL 全量+增量同步 + TM VDC 校验"
description: >
  覆盖完整黄金路径 17 步：
  登录 TM → 创建源/目标库 → 注册数据源 → 初始化源库数据 → 初始化目标库数据 → 创建同步任务 → 启动 → 等待全量 →
  创建 VDC 校验 → 断言全量一致 → 写入增量 → 等待增量同步 → 再次校验 → 停止任务 → 删除任务 → 清理。

# =============================================================================
# Step 1: 登录 TM 获取 access_token
# =============================================================================
steps:

  - id: login_tm
    action: tm_login
    outputs: [access_token, tm_base_url]

# =============================================================================
# Step 2-3: 并行创建源库和目标库（互相独立，无 outputs 交叉引用）
# =============================================================================
  - parallel:
      - id: create_src_db
        action: dbforge_create_database
        timeout_seconds: 120
        inputs:
          db_name: "gp_src_run30"
          db_type: "mysql"
          topology: "single"
        outputs: [lease_id, db_name, host, port, database, username, password, jdbc_url]

      - id: create_tgt_db
        action: dbforge_create_database
        timeout_seconds: 120
        inputs:
          db_name: "gp_tgt_run30"
          db_type: "mysql"
          topology: "single"
        outputs: [lease_id, db_name, host, port, database, username, password, jdbc_url]

# =============================================================================
# Step 4: 在 TM 上注册数据源
# =============================================================================
  - id: create_src_datasource
    action: tm_create_datasource
    timeout_seconds: 60
    inputs:
      name: "L3_GP_SRC_run30"
      database_type: "Mysql"
      connection_type: "source_and_target"
      database_host: "#{ #steps['create_src_db'].outputs['internal_host'] }"
      database_port: "#{ #steps['create_src_db'].outputs['port'] }"
      database_username: "#{ #steps['create_src_db'].outputs['username'] }"
      database_password: "#{ #steps['create_src_db'].outputs['password'] }"
      database_name: "#{ #steps['create_src_db'].outputs['database'] }"
      agent_id: "ca96cd0f-e7cc-41dd-a950-e10f89312b40"  # tapsupertest5 (working agent)
    outputs: [connection_id]

  - id: create_tgt_datasource
    action: tm_create_datasource
    timeout_seconds: 60
    inputs:
      name: "L3_GP_TGT_run30"
      database_type: "Mysql"
      connection_type: "source_and_target"
      database_host: "#{ #steps['create_tgt_db'].outputs['internal_host'] }"
      database_port: "#{ #steps['create_tgt_db'].outputs['port'] }"
      database_username: "#{ #steps['create_tgt_db'].outputs['username'] }"
      database_password: "#{ #steps['create_tgt_db'].outputs['password'] }"
      database_name: "#{ #steps['create_tgt_db'].outputs['database'] }"
      agent_id: "ca96cd0f-e7cc-41dd-a950-e10f89312b40"  # tapsupertest5 (working agent)
    outputs: [connection_id]

# =============================================================================
# Step 6: 初始化源库数据 (自动建表 + 插入初始数据)
# =============================================================================
  - id: init_source
    action: jdbc_init_source
    timeout_seconds: 120
    extra_deps:
      - "com.mysql:mysql-connector-j:8.3.0"
    inputs:
      jdbc_url: "#{ #steps['create_src_db'].outputs['jdbc_url'] }"
      username: "#{ #steps['create_src_db'].outputs['username'] }"
      password: "#{ #steps['create_src_db'].outputs['password'] }"
      table_count: 2
      columns_per_table: 5
      rows_per_table: 200
      drop_if_exists: true
    outputs: [table_names, total_rows, tables_created]

# =============================================================================
# Step 6b: 测试 TM 数据源连接 (确保 ready 再往下走)
# =============================================================================
  - id: test_connections
    action: tm_test_connection
    timeout_seconds: 60
    inputs:
      connection_ids:
        - "#{ #steps['create_src_datasource'].outputs['connection_id'] }"
        - "#{ #steps['create_tgt_datasource'].outputs['connection_id'] }"
      poll_interval_ms: 2000
      wait_timeout_seconds: 30
    outputs: [status, results]

# =============================================================================
# Step 7: 在 TM 创建同步任务
# =============================================================================
  - id: create_sync_task
    action: tm_create_task
    keep_alive: false
    timeout_seconds: 60
    inputs:
      name: "GP_MySQL_FullSync_CDC_run30"
      sync_type: "sync"
      agent_id: "ca96cd0f-e7cc-41dd-a950-e10f89312b40"
      source_connection_id: "#{ #steps['create_src_datasource'].outputs['connection_id'] }"
      target_connection_id: "#{ #steps['create_tgt_datasource'].outputs['connection_id'] }"
      source_tables: "#{ #steps['init_source'].outputs['table_names'] }"
    outputs: [task_id, sync_type]

# =============================================================================
# Step 8: 启动同步任务
# =============================================================================
  - id: start_sync_task
    action: tm_start_task
    timeout_seconds: 60
    inputs:
      task_id: "#{ #steps['create_sync_task'].outputs['task_id'] }"

# =============================================================================
# Step 8: 等待任务完成全量同步
# =============================================================================
  - id: wait_full_sync
    action: tm_wait_task
    timeout_seconds: 600
    inputs:
      task_id: "#{ #steps['create_sync_task'].outputs['task_id'] }"
      target_status: "complete"
      poll_interval_ms: 5000
      wait_timeout_seconds: 300
    outputs: [final_status, reached_target]

# =============================================================================
# Step 9: 创建 VDC 校验任务
# =============================================================================
  - id: create_inspect_task
    action: tm_create_inspect
    keep_alive: false
    timeout_seconds: 60
    inputs:
      name: "GP_VDC_run30"
      task_id: "#{ #steps['create_sync_task'].outputs['task_id'] }"
      agent_id: "#{ #steps['create_sync_task'].outputs['agent_id'] }"
      source_connection_id: "#{ #steps['create_src_datasource'].outputs['connection_id'] }"
      target_connection_id: "#{ #steps['create_tgt_datasource'].outputs['connection_id'] }"
      tables: "#{ #steps['init_source'].outputs['table_names'] }"
      inspect_mode: "all"
    outputs: [inspect_id]

# =============================================================================
# Step 10: 执行 VDC 校验 (全量一致性校验)
# =============================================================================
  - id: run_inspect_full
    action: tm_execute_inspect
    timeout_seconds: 300
    inputs:
      inspect_id: "#{ #steps['create_inspect_task'].outputs['inspect_id'] }"
    outputs: [status, mismatched_tables, mismatched_rows, success]

# =============================================================================
# Step 11: 断言全量数据一致
# =============================================================================
  - id: assert_full_sync_consistent
    action: tm_assert_inspect_result
    timeout_seconds: 60
    inputs:
      inspect_id: "#{ #steps['create_inspect_task'].outputs['inspect_id'] }"
      allow_mismatch: false

# =============================================================================
# Step 12: 写入增量数据 (INSERT + UPDATE + DELETE)
# =============================================================================
  - id: write_incremental
    action: jdbc_write_incremental
    timeout_seconds: 120
    extra_deps:
      - "com.mysql:mysql-connector-j:8.3.0"
    inputs:
      jdbc_url: "#{ #steps['create_src_db'].outputs['jdbc_url'] }"
      username: "#{ #steps['create_src_db'].outputs['username'] }"
      password: "#{ #steps['create_src_db'].outputs['password'] }"
      table_name: "#{ #steps['init_source'].outputs['table_names'][0] }"
      use_transaction: true
      operation_counts:
        insert: 10
        update: 20
        delete: 50
    outputs: [total_operations, operations_insert, operations_update, operations_delete]

# =============================================================================
# Step 13: 等待增量数据同步
# =============================================================================
  - id: wait_incremental_sync
    action: tm_wait_task
    timeout_seconds: 300
    inputs:
      task_id: "#{ #steps['create_sync_task'].outputs['task_id'] }"
      target_status: "complete"
      poll_interval_ms: 5000
      wait_timeout_seconds: 120
    outputs: [final_status, reached_target]

# =============================================================================
# Step 14: 再次执行 VDC 校验 (增量后验证)
# =============================================================================
  - id: run_inspect_incremental
    action: tm_execute_inspect
    timeout_seconds: 300
    inputs:
      inspect_id: "#{ #steps['create_inspect_task'].outputs['inspect_id'] }"
    outputs: [status, mismatched_tables, mismatched_rows, success]

# =============================================================================
# Step 15: 断言增量数据一致
# =============================================================================
  - id: assert_incremental_consistent
    action: tm_assert_inspect_result
    timeout_seconds: 60
    inputs:
      inspect_id: "#{ #steps['create_inspect_task'].outputs['inspect_id'] }"
      allow_mismatch: false

# =============================================================================
# Step 16: 停止同步任务
# =============================================================================
  - id: stop_sync_task
    action: tm_stop_task
    timeout_seconds: 60
    inputs:
      task_id: "#{ #steps['create_sync_task'].outputs['task_id'] }"

# =============================================================================
# Step 17: 删除同步任务
# =============================================================================
  - id: delete_sync_task
    action: tm_delete_task
    timeout_seconds: 60
    inputs:
      task_id: "#{ #steps['create_sync_task'].outputs['task_id'] }"

# =============================================================================
# Cleanup 说明
#   - dbforge租约: dbforge_create_database 自动 registerCleanup → 删除 lease
#   - 数据源: tm_create_datasource 自动 registerCleanup → 删除 Connection
#   - Task: tm_create_task 自动 registerCleanup → stop + delete
#   - Inspect: tm_create_inspect 自动 registerCleanup → 删除 Inspect
#   - ScenarioRunner 结束时自动按 LIFO 栈顺序执行所有 cleanup
# =============================================================================
