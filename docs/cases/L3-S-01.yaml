case_id: "L3-S-01"
scenario: "TM 重启恢复 — 运行中重启 TM 后任务归属/状态不丢，CDC 继续同步"
group: "stability"
description: >-
  管理端视角的 TM 重启恢复用例（对应 wiki L3-S-01）：
  (1) dbforge 创建 TapData MongoDB 中间库 + 部署 1 TM / 1 Engine / 1 ApiServer；
  (2) dbforge 创建源/目标两个 MySQL，初始化源库表和数据；
  (3) 创建数据复制任务（全量+增量），等待进入增量（CDC）阶段，记录任务所在 engine；
  (4) 滚动重启 TM（kubectl rollout restart），等待新 Pod Ready 并重新登录；
  (5) 断言：任务状态自动恢复为 running（重启后 TM 从 Mongo 重建状态）；
  (6) 重启后源库继续写入增量数据，断言目标端行数正确并进行 VDC 全量一致性校验
      —— 证明 TM 重启不影响引擎侧运行中的 CDC；
  (7) 收尾：卸载集群，释放全部 dbforge 租约。
  TM 侧「状态不丢」用行为断言（重启后任务仍 running 且增量继续同步）验证，
  任务归属则通过 tm_get_task 的 agentId 前后对比记录。

# 说明：
# - TM API 通过 kubectl patch svc → NodePort 30321 暴露；NodePort 只在 K8s 节点 IP 上可达，
#   故 TM_BASE_URL 用 control-plane 节点 IP（与 L3-HA-ENGINE-FAILOVER 同一约定）。
# - access_code 不显式设置：全新部署使用产品默认 accessCode
#   （3324cfdf-7d3e-4792-bd32-571638d4562f，与 TmClient 默认值一致）。
env:
  TM_BASE_URL: "http://192.168.1.193:30321"

steps:
  # ============================================================
  # 0. 申请 License
  # ============================================================
  - id: "fetch_license"
    action: "get_license"
    inputs:
      base_url: "http://192.168.1.184:18080"
      username: "license-temp"
      password: "Gotapd8!"
      customer: "tapdata-it"
      reason: "L3 TM restart recovery e2e test"
      valid_days: 30
      version: "4.25.0"
      license_type: "OP"
      engine_limit: 3
    outputs: [license]
    timeout_seconds: 60

  # ============================================================
  # 1. dbforge 创建 TapData MongoDB 中间库（replica set — TM 需要 change stream）
  # ============================================================
  - id: "create_mongo"
    action: "dbforge_create_database"
    inputs:
      db_type: "mongodb"
      mode: "dedicated"
      topology: "replicaset"
    outputs: [lease_id, uri, host, internal_host, port, database, username, password]
    timeout_seconds: 300

  # ============================================================
  # 2. 在租约 MongoDB 的 admin 库补建同名用户
  #    （TM 镜像 entrypoint 固定用 authenticationDatabase=admin 认证）
  # ============================================================
  - id: "grant_mongo_admin_user"
    action: "exec"
    inputs:
      host: "localhost"
      namespace: "dbforge-env-ephemeral"
      pod: "#{ #steps['create_mongo'].outputs['lease_id'] }-0"
      container: "mongodb"
      command: "mongosh -u \"$MONGODB_INITDB_ROOT_USERNAME\" -p \"$MONGODB_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --quiet --eval \"try { db.getSiblingDB('admin').createUser({user:'#{ #steps['create_mongo'].outputs['username'] }',pwd:'#{ #steps['create_mongo'].outputs['password'] }',roles:[{role:'dbOwner',db:'#{ #steps['create_mongo'].outputs['database'] }'}]}); print('GRANT_OK created'); } catch(e) { if (e.message.includes('already exists')) { print('GRANT_OK exists'); } else { throw e; } }\""
      expect_stdout_contains: "GRANT_OK"
    timeout_seconds: 60

  # ============================================================
  # 3. 部署 TapData：1 TM + 0 Engine + 1 ApiServer
  #    engine 先 0 副本：等 accessCode 对齐后再扩容，避免 engine 登录失败后清空 dist
  # ============================================================
  - id: "deploy_tapdata"
    action: "deploy_tapdata"
    inputs:
      host: "localhost"
      prebuilt_image: "192.168.1.184:5001/tapdata/tapdata-enterprise:latest"
      harbor_registry: "192.168.1.184:5001"
      mongodb_uri: "mongodb://#{ #steps['create_mongo'].outputs['username'] }:#{ #steps['create_mongo'].outputs['password'] }@#{ #steps['create_mongo'].outputs['internal_host'] }:#{ #steps['create_mongo'].outputs['internal_port'] }/#{ #steps['create_mongo'].outputs['database'] }?authSource=admin"
      mongodb_user: "#{ #steps['create_mongo'].outputs['username'] }"
      mongodb_password: "#{ #steps['create_mongo'].outputs['password'] }"
      mongodb_database: "#{ #steps['create_mongo'].outputs['database'] }"
      mongodb_auth_source: "admin"
      namespace: "tapdata-l3-s01"
      server_replicas: 1
      engine_replicas: 0
      apiserver_replicas: 1
      backend_url: "http://tapdata-server-svr.tapdata-l3-s01.svc.cluster.local:3030/api/"
      license_host: "192.168.1.184:18080"
      license: "#{ #steps['fetch_license'].outputs['license'] }"
    outputs: [namespace, helmRelease]
    # TM 冷启动实测 8~13 分钟，900s 不够
    timeout_seconds: 1500

  # ============================================================
  # 4. 暴露 TM API：patch tapdata-server-svr → NodePort 30321
  # ============================================================
  - id: "expose_tm_nodeport"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-l3-s01"
      command: "patch svc tapdata-server-svr --type=merge -p '{\"spec\":{\"type\":\"NodePort\",\"ports\":[{\"port\":3030,\"targetPort\":3030,\"nodePort\":30321,\"protocol\":\"TCP\"}]}}'"
      expect_stdout_contains: "patched"
    timeout_seconds: 60

  # ============================================================
  # 5. 等待 TM / ApiServer Ready、Engine 保持 0 副本
  # ============================================================
  - id: "tm_replicas_1"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-l3-s01"
      command: "get deploy tapdata-tapdata-server -o jsonpath='{.status.readyReplicas}'"
      expect_stdout_equals: "1"
      max_attempts: 90
      poll_interval_seconds: 5
    timeout_seconds: 500

  - id: "engine_replicas_0"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-l3-s01"
      command: "get deploy tapdata-tapdata-engine -o jsonpath='{.spec.replicas}'"
      expect_stdout_equals: "0"
      max_attempts: 60
      poll_interval_seconds: 5
    timeout_seconds: 400

  - id: "apiserver_replicas_1"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-l3-s01"
      command: "get deploy tapdata-tapdata-apiserver -o jsonpath='{.status.readyReplicas}'"
      expect_stdout_equals: "1"
      max_attempts: 60
      poll_interval_seconds: 5
    timeout_seconds: 400

  # ============================================================
  # 6. 登录 TM（K8s Ready 不代表应用就绪 — 轮询等待直到拿到 token）
  # ============================================================
  - id: "login_tm"
    action: "tm_login"
    inputs:
      wait_timeout_seconds: 300
      poll_interval_ms: 5000
    outputs: [access_token, tm_base_url]
    timeout_seconds: 360

  # ============================================================
  # 7. 对齐 accessCode（镜像内 accessCode 为占位符 <ACCESS_CODE>）
  # ============================================================
  - id: "align_access_code"
    action: "exec"
    inputs:
      host: "localhost"
      namespace: "dbforge-env-ephemeral"
      pod: "#{ #steps['create_mongo'].outputs['lease_id'] }-0"
      container: "mongodb"
      command: "mongosh -u \"$MONGODB_INITDB_ROOT_USERNAME\" -p \"$MONGODB_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --quiet --eval \"var dbx=db.getSiblingDB('#{ #steps['create_mongo'].outputs['database'] }'); var done=0; ['User','users'].forEach(function(c){ if(done===0){ var col=dbx.getCollection(c); if(col.countDocuments({\\$or:[{accesscode:'<ACCESS_CODE>'},{accessCode:'<ACCESS_CODE>'}]})>0){ done=1; return; } var u=col.findOne({\\$or:[{accesscode:'3324cfdf-7d3e-4792-bd32-571638d4562f'},{accessCode:'3324cfdf-7d3e-4792-bd32-571638d4562f'}]}); if(u){ u._id=new ObjectId(); delete u.accessCode; u.accesscode='<ACCESS_CODE>'; u.email='admin-s01@tapdata.io'; if(u.username){ u.username='admin-s01'; } col.insertOne(u); done=1; } } }); print('ALIGN_OK inserted='+done);\""
      expect_stdout_contains: "ALIGN_OK inserted=1"
    timeout_seconds: 60

  # ============================================================
  # 8. accessCode 对齐后扩容 engine 到 1 副本并等待 Ready
  # ============================================================
  - id: "scale_engine_to_1"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-l3-s01"
      command: "scale deploy tapdata-tapdata-engine --replicas=1"
      expect_stdout_contains: "scaled"
    timeout_seconds: 60

  - id: "engine_ready_1"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-l3-s01"
      command: "get deploy tapdata-tapdata-engine -o jsonpath='{.status.readyReplicas}'"
      expect_stdout_equals: "1"
      max_attempts: 90
      poll_interval_seconds: 5
    timeout_seconds: 500

  # ============================================================
  # 9. 向 TM 注册 connector（生成 DatabaseTypes / pdkHash）
  # ============================================================
  - id: "deploy_connectors"
    action: "exec"
    inputs:
      host: "localhost"
      namespace: "tapdata-l3-s01"
      pod: "tapdata-tapdata-engine"
      command: "cd /tapdata/apps/lib && for j in /tapdata/apps/dist/*.jar; do echo \">> deploying $j\"; timeout 180 java \"-Dtapdata_proxy_mongodb_uri=mongodb://#{ #steps['create_mongo'].outputs['username'] }:#{ #steps['create_mongo'].outputs['password'] }@#{ #steps['create_mongo'].outputs['internal_host'] }:#{ #steps['create_mongo'].outputs['internal_port'] }/#{ #steps['create_mongo'].outputs['database'] }?authSource=admin\" -jar pdk-deploy.jar register -a 3324cfdf-7d3e-4792-bd32-571638d4562f -t http://tapdata-server-svr.tapdata-l3-s01.svc.cluster.local:3030 \"$j\" 2>&1 | tail -5; done; curl -s -m 15 -o /dev/null -w \"init_http:%{http_code}\" http://tapdata-server-svr.tapdata-l3-s01.svc.cluster.local:3030/api/init; echo; echo DEPLOY_DONE"
      expect_stdout_contains: "DEPLOY_DONE"
    timeout_seconds: 620

  # ============================================================
  # 10. 并行创建源/目标两个 MySQL
  # ============================================================
  - parallel:
      - id: "create_src_db"
        action: "dbforge_create_database"
        timeout_seconds: 300
        inputs:
          db_type: "mysql"
          mode: "dedicated"
          topology: "single"
        outputs: [lease_id, db_name, host, internal_host, port, database, username, password, jdbc_url]

      - id: "create_tgt_db"
        action: "dbforge_create_database"
        timeout_seconds: 300
        inputs:
          db_type: "mysql"
          mode: "dedicated"
          topology: "single"
        outputs: [lease_id, db_name, host, internal_host, port, database, username, password, jdbc_url]

  # ============================================================
  # 11. 注册源/目标数据源（不传 agent_id，TM 自动分配）
  # ============================================================
  - id: "create_src_datasource"
    action: "tm_create_datasource"
    timeout_seconds: 360
    inputs:
      name: "L3_S01_SRC"
      database_type: "Mysql"
      connection_type: "source_and_target"
      database_host: "#{ #steps['create_src_db'].outputs['internal_host'] }"
      database_port: "#{ #steps['create_src_db'].outputs['internal_port'] }"
      database_username: "#{ #steps['create_src_db'].outputs['username'] }"
      database_password: "#{ #steps['create_src_db'].outputs['password'] }"
      database_name: "#{ #steps['create_src_db'].outputs['database'] }"
    outputs: [connection_id]

  - id: "create_tgt_datasource"
    action: "tm_create_datasource"
    timeout_seconds: 360
    inputs:
      name: "L3_S01_TGT"
      database_type: "Mysql"
      connection_type: "source_and_target"
      database_host: "#{ #steps['create_tgt_db'].outputs['internal_host'] }"
      database_port: "#{ #steps['create_tgt_db'].outputs['internal_port'] }"
      database_username: "#{ #steps['create_tgt_db'].outputs['username'] }"
      database_password: "#{ #steps['create_tgt_db'].outputs['password'] }"
      database_name: "#{ #steps['create_tgt_db'].outputs['database'] }"
    outputs: [connection_id]

  # ============================================================
  # 12. 初始化源库数据（2 张表，每表 200 行）
  # ============================================================
  - id: "init_source"
    action: "jdbc_init_source"
    timeout_seconds: 180
    extra_deps:
      - "com.mysql:mysql-connector-j:8.3.0"
    inputs:
      jdbc_url: "#{ #steps['create_src_db'].outputs['jdbc_url'] }"
      username: "#{ #steps['create_src_db'].outputs['username'] }"
      password: "#{ #steps['create_src_db'].outputs['password'] }"
      table_count: 2
      columns_per_table: 5
      rows_per_table: 200
      drop_if_exists: true
    outputs: [table_names, total_rows, tables_created]

  # ============================================================
  # 13. 数据源连接测试
  # ============================================================
  - id: "test_connections"
    action: "tm_test_connection"
    timeout_seconds: 120
    inputs:
      connection_ids:
        - "#{ #steps['create_src_datasource'].outputs['connection_id'] }"
        - "#{ #steps['create_tgt_datasource'].outputs['connection_id'] }"
      poll_interval_ms: 2000
      wait_timeout_seconds: 60
    outputs: [status, results]

  # ============================================================
  # 14. 创建并启动数据复制任务（全量+增量）
  # ============================================================
  - id: "create_sync_task"
    action: "tm_create_task"
    keep_alive: false
    timeout_seconds: 120
    inputs:
      name: "L3_S01_TM_Restart_Recovery"
      sync_type: "sync"
      source_connection_id: "#{ #steps['create_src_datasource'].outputs['connection_id'] }"
      target_connection_id: "#{ #steps['create_tgt_datasource'].outputs['connection_id'] }"
      source_tables: "#{ #steps['init_source'].outputs['table_names'] }"
    outputs: [task_id, sync_type]

  - id: "start_sync_task"
    action: "tm_start_task"
    timeout_seconds: 60
    inputs:
      task_id: "#{ #steps['create_sync_task'].outputs['task_id'] }"

  - id: "wait_cdc"
    action: "tm_wait_task"
    timeout_seconds: 700
    inputs:
      task_id: "#{ #steps['create_sync_task'].outputs['task_id'] }"
      target_status: "complete"
      poll_interval_ms: 5000
      wait_timeout_seconds: 600
    outputs: [final_status, reached_target]

  # ============================================================
  # 15. 记录重启前的任务归属（engine Pod 名 + agentId）
  # ============================================================
  - id: "locate_engine_before_restart"
    action: "tm_get_task_engine"
    timeout_seconds: 60
    inputs:
      task_id: "#{ #steps['create_sync_task'].outputs['task_id'] }"
    outputs: [agent_id, hostname, worker_status]

  - id: "task_before_restart"
    action: "tm_get_task"
    timeout_seconds: 60
    inputs:
      task_id: "#{ #steps['create_sync_task'].outputs['task_id'] }"
    outputs: [status, agent_id, ping_time]

  # ============================================================
  # 16. 滚动重启 TM（模拟管理端重启），等待 rollout 完成
  # ============================================================
  - id: "restart_tm"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-l3-s01"
      command: "rollout restart deploy tapdata-tapdata-server"
      expect_stdout_contains: "restarted"
    timeout_seconds: 120

  - id: "wait_tm_rollout"
    action: "kubectl"
    inputs:
      host: "localhost"
      namespace: "tapdata-l3-s01"
      command: "rollout status deploy tapdata-tapdata-server --timeout=420s"
      expect_stdout_contains: "successfully rolled out"
    timeout_seconds: 480

  # ============================================================
  # 17. 重启后重新登录 TM（等待应用就绪）
  # ============================================================
  - id: "relogin_tm"
    action: "tm_login"
    inputs:
      wait_timeout_seconds: 300
      poll_interval_ms: 5000
    outputs: [access_token, tm_base_url]
    timeout_seconds: 360

  # ============================================================
  # 18. 断言任务状态恢复为 running（TM 重启后任务归属/状态不丢）
  # ============================================================
  - id: "wait_task_recovered"
    action: "tm_wait_task"
    timeout_seconds: 360
    inputs:
      task_id: "#{ #steps['create_sync_task'].outputs['task_id'] }"
      target_status: "running"
      poll_interval_ms: 5000
      wait_timeout_seconds: 300
    outputs: [final_status, reached_target]

  - id: "locate_engine_after_restart"
    action: "tm_get_task_engine"
    timeout_seconds: 60
    inputs:
      task_id: "#{ #steps['create_sync_task'].outputs['task_id'] }"
    outputs: [agent_id, hostname, worker_status]

  - id: "task_after_restart"
    action: "tm_get_task"
    timeout_seconds: 60
    inputs:
      task_id: "#{ #steps['create_sync_task'].outputs['task_id'] }"
    outputs: [status, agent_id, ping_time]

  # ============================================================
  # 19. 重启后继续写入增量数据（验证 CDC 未中断）
  # ============================================================
  - id: "write_incremental"
    action: "jdbc_write_incremental"
    timeout_seconds: 120
    extra_deps:
      - "com.mysql:mysql-connector-j:8.3.0"
    inputs:
      jdbc_url: "#{ #steps['create_src_db'].outputs['jdbc_url'] }"
      username: "#{ #steps['create_src_db'].outputs['username'] }"
      password: "#{ #steps['create_src_db'].outputs['password'] }"
      table_name: "#{ #steps['init_source'].outputs['table_names'][0] }"
      use_transaction: true
      operation_counts:
        insert: 10
        update: 20
        delete: 50
    outputs: [total_operations, operations_insert, operations_update, operations_delete]

  # ============================================================
  # 20. 断言目标端数据正确（table[0]: 200+10-50=160，table[1]: 200）
  # ============================================================
  - id: "wait_incr_table0"
    action: "assert_jdbc_data"
    timeout_seconds: 240
    inputs:
      jdbc_url: "#{ #steps['create_tgt_db'].outputs['jdbc_url'] }"
      username: "#{ #steps['create_tgt_db'].outputs['username'] }"
      password: "#{ #steps['create_tgt_db'].outputs['password'] }"
      sql: "SELECT COUNT(*) AS cnt FROM #{ #steps['init_source'].outputs['table_names'][0] }"
      assert_mode: "value_equals"
      column: "cnt"
      expected: 160
      poll_interval: 5
      max_attempts: 36

  - id: "wait_incr_table1"
    action: "assert_jdbc_data"
    timeout_seconds: 240
    inputs:
      jdbc_url: "#{ #steps['create_tgt_db'].outputs['jdbc_url'] }"
      username: "#{ #steps['create_tgt_db'].outputs['username'] }"
      password: "#{ #steps['create_tgt_db'].outputs['password'] }"
      sql: "SELECT COUNT(*) AS cnt FROM #{ #steps['init_source'].outputs['table_names'][1] }"
      assert_mode: "value_equals"
      column: "cnt"
      expected: 200
      poll_interval: 5
      max_attempts: 36

  # ============================================================
  # 21. VDC 全量一致性校验（重启后 TM 仍能正常创建/执行校验任务）
  # ============================================================
  - id: "create_inspect"
    action: "tm_create_inspect"
    keep_alive: false
    timeout_seconds: 120
    inputs:
      name: "L3_S01_VDC"
      task_id: "#{ #steps['create_sync_task'].outputs['task_id'] }"
      source_connection_id: "#{ #steps['create_src_datasource'].outputs['connection_id'] }"
      target_connection_id: "#{ #steps['create_tgt_datasource'].outputs['connection_id'] }"
      tables: "#{ #steps['init_source'].outputs['table_names'] }"
      inspect_mode: "all"
      # MySQL 表主键是 id（镜像默认 _id 属于 MongoDB）
      sort_column: "id"
    outputs: [inspect_id]

  - id: "run_inspect"
    action: "tm_execute_inspect"
    timeout_seconds: 300
    inputs:
      inspect_id: "#{ #steps['create_inspect'].outputs['inspect_id'] }"
    outputs: [status, mismatched_tables, mismatched_rows, success]

  - id: "assert_data_consistent"
    action: "tm_assert_inspect_result"
    timeout_seconds: 60
    inputs:
      inspect_id: "#{ #steps['create_inspect'].outputs['inspect_id'] }"
      allow_mismatch: false

  # ============================================================
  # 22. 收尾：卸载 TapData 集群
  # ============================================================
  - id: "cleanup"
    action: "undeploy_tapdata"
    inputs:
      namespace: "tapdata-l3-s01"
      helm_release: "tapdata"
      host: "localhost"
      cancel_pending_cleanups: true
    timeout_seconds: 300
