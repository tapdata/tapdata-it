# 可复用 Connector 集成测试 workflow（维护于 tapdata-it 仓库）
#
# 由 tapdata-connectors（开源）与 tapdata-connectors-enterprise（闭源）通过 workflow_call 触发：
# 1. 自动分析本次提交/PR 变更，沿 Maven 反向传递依赖挑选受影响且含 src/it/java 的模块。
#    同时合并基线与当前 POM 图，覆盖删除模块、父 POM、聚合模块和 profile 依赖。
# 2. 对每个选中的模块执行 maven-failsafe 集成测试（跳过 surefire 单测，规避 Byte Buddy/JDK 兼容问题）。
# 3. 将 target/failsafe-reports 打包上传为 artifacts，命名包含仓库 owner、模块与 commit SHA，
#    与当前提交/PR 关联。
#
# 引用方式（两个 connector 仓库的 connector-it.yml）：
#   uses: tapdata/tapdata-it/.github/workflows/connector-it-reusable.yml@main
# workflow_call 中 github 上下文自动继承调用方仓库（github.repository / github.sha / github.event 等），
# 同一份 workflow 无需区分开源/闭源仓库。
#
# 运行环境：
#  - analyze（仅 diff 分析，不访问内网资源）：GitHub 托管 runner（ubuntu-latest），直连 GitHub 无需代理
#  - test（集成测试）：tapdata-it 标签的自托管 runner（需组织级注册并对调用方仓库开放；
#    需预装 git/jq/Maven/JDK 17（JAVA_HOME=/usr/java/jdk-17.0.12），可访问公司内网测试资源与私有 Nexus）
# 网络（test job）：git 访问 GitHub 经 ssh SOCKS 代理（ssh -D 1234 proxy_server），代理配置由
# runner 容器挂载（/root/.ssh/config + id_ed25519），job 启动代理并在收尾清理。
name: Connector Integration Tests (Reusable)

on:
  workflow_call:
    inputs:
      common_changed_strategy:
        description: '公共模块变更策略：affected（按 Maven 传递依赖筛选，默认）或 all（保守全量）'
        required: false
        type: string
        default: 'affected'
      connectors_override:
        description: '手工指定模块列表（逗号分隔的模块相对路径），跳过 diff 分析；用于 workflow_dispatch 调试'
        required: false
        type: string
        default: ''
    secrets:
      MAVEN_SETTINGS:
        description: '可选：私有 Nexus 需要认证时注入的 ~/.m2/settings.xml 内容'
        required: false

jobs:
  # 分析提交内容：挑选被修改且含 IT 用例的 connector 模块，输出 JSON 数组驱动矩阵。
  # 仅涉及 git 操作与 jq（ubuntu-latest 预装），运行在 GitHub 托管 runner，不占用自建 runner
  analyze:
    runs-on: ubuntu-latest
    outputs:
      connectors: ${{ steps.analyze.outputs.connectors }}
      has_changes: ${{ steps.analyze.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze changed connectors
        id: analyze
        shell: bash
        env:
          CONNECTORS_OVERRIDE: ${{ inputs.connectors_override }}
          COMMON_STRATEGY: ${{ inputs.common_changed_strategy }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # BEGIN dependency analyzer (tested directly by tests/ci/test_it_selection.py)
          python3 - <<'PY'
          import collections
          import json
          import os
          import re
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          def parse_pom(text):
              root = ET.fromstring(text)
              for element in root.iter():
                  element.tag = element.tag.rsplit("}", 1)[-1]
              return root

          def dependency_graph(poms):
              roots = {path: parse_pom(text) for path, text in poms.items()}
              reverse = collections.defaultdict(set)
              coordinates = collections.defaultdict(set)
              properties = {}
              parents = {}

              def values(path, visiting=None):
                  if path in properties:
                      return properties[path]
                  visiting = set() if visiting is None else visiting
                  if path in visiting:
                      raise ValueError("Cyclic Maven parent: " + path)
                  root = roots[path]
                  parent = root.find("parent")
                  result = {}
                  if parent is not None:
                      relative = parent.find("relativePath")
                      relative = "../pom.xml" if relative is None else (relative.text or "")
                      if relative:
                          candidate = os.path.normpath(str(Path(path).parent / relative))
                          if candidate in roots:
                              parents[path] = candidate
                              result.update(values(candidate, visiting | {path}))
                      result["project.parent.groupId"] = parent.findtext("groupId", "")
                  for prop in root.findall("./properties/*") + root.findall("./profiles/profile/properties/*"):
                      result[prop.tag] = prop.text or ""
                  group = root.findtext("groupId") or result.get("project.groupId") or result.get("project.parent.groupId", "")
                  result.update({"project.groupId": group, "pom.groupId": group,
                                 "project.artifactId": root.findtext("artifactId", "")})
                  properties[path] = result
                  return result

              def resolve(value, props):
                  value = value or ""
                  for _ in range(20):
                      updated = re.sub(r"\$\{([^}]+)\}", lambda match: props.get(match[1], match[0]), value)
                      if updated == value:
                          break
                      value = updated
                  return value

              for path, root in roots.items():
                  props = values(path)
                  key = (resolve(props["project.groupId"], props), resolve(root.findtext("artifactId"), props))
                  coordinates[key].add(path)
              for path, root in roots.items():
                  props = properties[path]
                  if path in parents:
                      reverse[parents[path]].add(path)
                  # Aggregate POM changes affect their children, not unrelated reactors.
                  for module in root.findall("./modules/module") + root.findall("./profiles/profile/modules/module"):
                      child = os.path.normpath(str(Path(path).parent / (module.text or "") / "pom.xml"))
                      if child in roots:
                          reverse[path].add(child)
                  # Include profile, managed/BOM and plugin dependencies conservatively.
                  references = root.findall(".//dependency") + root.findall("./parent")
                  for dependency in references:
                      group = resolve(dependency.findtext("groupId"), props)
                      artifact = resolve(dependency.findtext("artifactId"), props)
                      if "${" in group or "${" in artifact:
                          raise ValueError("Unresolved Maven dependency coordinate in " + path)
                      for upstream in coordinates.get((group, artifact), ()):
                          if upstream != path:
                              reverse[upstream].add(path)
              return reverse

          def affected_modules(changed, graphs, pom_paths, candidates, strategy="affected"):
              if "pom.xml" in changed:
                  return sorted(candidates)
              if strategy == "all" and any(path.startswith("connectors-common/") for path in changed):
                  return sorted(candidates)
              reverse = collections.defaultdict(set)
              for graph in graphs:
                  for upstream, downstream in graph.items():
                      reverse[upstream].update(downstream)
              seeds = set()
              for filename in changed:
                  directory = Path(filename).parent
                  while str(directory) != ".":
                      pom = str(directory / "pom.xml")
                      if pom in pom_paths:
                          seeds.add(pom)
                          break
                      directory = directory.parent
              seen = set(seeds)
              pending = list(seeds)
              while pending:
                  for downstream in reverse.get(pending.pop(), ()):
                      if downstream not in seen:
                          seen.add(downstream)
                          pending.append(downstream)
              return sorted(module for module in candidates if module + "/pom.xml" in seen)

          def main():
              candidates = discover_candidates()
              override = os.environ.get("CONNECTORS_OVERRIDE", "")
              strategy = os.environ.get("COMMON_STRATEGY", "affected")
              if strategy not in ("all", "affected"):
                  raise ValueError("Invalid common_changed_strategy")
              if override.strip():
                  selected = sorted({module.strip() for module in override.split(",") if module.strip()})
                  validate_modules(selected)
                  if not all(module in candidates for module in selected):
                      raise ValueError("Override must name existing modules with src/it/java")
              else:
                  if os.environ.get("EVENT_NAME") == "pull_request":
                      base = os.environ["BASE_REF"]
                      git("fetch", "origin", "+refs/heads/" + base + ":refs/remotes/origin/" + base)
                      base = git("merge-base", "HEAD", "origin/" + base)
                  else:
                      base = os.environ.get("BEFORE_SHA", "")
                      if not base or not base.strip("0"):
                          try:
                              base = git("rev-parse", "HEAD^")
                          except subprocess.CalledProcessError:
                              base = ""
                  changed = git("diff", "--name-only", base, "HEAD").splitlines() if base else ["pom.xml"]
                  print("Changed files:", json.dumps(changed))
                  try:
                      graphs = []
                      pom_paths = set()
                      # Union old/new graphs: removals and dependency rewrites must not hide affected consumers.
                      for revision in (base or "HEAD", "HEAD"):
                          paths = [path for path in git("ls-tree", "-r", "--name-only", revision).splitlines()
                                   if path == "pom.xml" or path.endswith("/pom.xml")]
                          poms = {path: git("show", revision + ":" + path) for path in paths}
                          pom_paths.update(paths)
                          graphs.append(dependency_graph(poms))
                      selected = affected_modules(changed, graphs, pom_paths, candidates, strategy)
                  except (ET.ParseError, ValueError, subprocess.CalledProcessError) as error:
                      print("Dependency analysis incomplete; conservatively running all IT:", error)
                      selected = sorted(candidates)
              print("Selected IT modules:", json.dumps(selected))
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("connectors=" + json.dumps(selected, separators=(",", ":")) + "\n")
                  output.write("has_changes=" + str(bool(selected)).lower() + "\n")

          def supported_module(module):
              return re.fullmatch(r"(connectors|connectors-common|connectors-javascript|file-storages)/[A-Za-z0-9_][A-Za-z0-9_.-]*(/[A-Za-z0-9_][A-Za-z0-9_.-]*)*", module) is not None

          def discover_candidates():
              # Discover only supported module trees; unrelated IT suites are not connector IT.
              candidates = set()
              for prefix in ("connectors", "connectors-common", "connectors-javascript", "file-storages"):
                  for path in Path(prefix).glob("**/src/it/java"):
                      module = path.parents[2]
                      if supported_module(str(module)) and path.is_dir() and (module / "pom.xml").is_file():
                          candidates.add(str(module))
              return candidates

          def validate_modules(modules):
              for module in modules:
                  if not supported_module(module):
                      raise ValueError("Unsafe or unsupported IT module path: " + repr(module))

          if __name__ == "__main__":
              main()
          PY
          # END dependency analyzer

  # 矩阵执行：每个受传递依赖影响的 connector 独立跑集成测试
  test:
    name: IT - ${{ matrix.connector }}
    needs: analyze
    if: needs.analyze.outputs.has_changes == 'true'
    runs-on: tapdata-it
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        connector: ${{ fromJson(needs.analyze.outputs.connectors) }}
    steps:
      # 第零步：启动 ssh SOCKS 代理并配置 git（同 analyze job，checkout 与后续 mvn 拉依赖均需外网）
      - name: Start SOCKS proxy and configure git
        shell: bash
        run: |
          set -euo pipefail
          ssh -f -N -D 1234 -o StrictHostKeyChecking=no -o ExitOnForwardFailure=yes -o ServerAliveInterval=60 proxy_server
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/1234) 2>/dev/null; then
              break
            fi
            sleep 1
          done
          git config --global http.proxy socks5h://localhost:1234
          git config --global https.proxy socks5h://localhost:1234
          echo "SOCKS proxy ready on localhost:1234"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute connector short name
        id: name
        shell: bash
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          SAFE="$(printf '%s' "$CONNECTOR" | tr '/' '-')"
          echo "safe=${SAFE}" >> "$GITHUB_OUTPUT"
          echo "label=${SAFE}" >> "$GITHUB_OUTPUT"

      # 检查 JDK 可用性：runner 镜像已预装 JDK 17（/usr/java/jdk-17.0.12），
      # 不使用 actions/setup-java 下载安装；每个 Runner 使用独立的持久化 Maven 本地仓库。
      - name: Check JDK 17 and set JAVA_HOME
        shell: bash
        run: |
          set -euo pipefail
          # 1. 检查 JDK 17 目录与 java 可执行文件
          [[ -d /usr/java/jdk-17.0.12 ]] || { echo "::error::/usr/java/jdk-17.0.12 目录不存在"; exit 1; }
          [[ -x /usr/java/jdk-17.0.12/bin/java ]] || { echo "::error::/usr/java/jdk-17.0.12/bin/java 不可执行"; exit 1; }
          # 2. 设置 JAVA_HOME（指向 JDK 根目录，mvn 脚本按 $JAVA_HOME/bin/java 解析）并导出到后续步骤
          echo "JAVA_HOME=/usr/java/jdk-17.0.12" >> "$GITHUB_ENV"
          # 3. JDK bin 加入 PATH（GITHUB_PATH 后续步骤生效且优先），避免镜像默认 java（如 1.8）被误用
          echo "/usr/java/jdk-17.0.12/bin" >> "$GITHUB_PATH"
          /usr/java/jdk-17.0.12/bin/java -version 2>&1 | head -3

      - name: Configure Maven settings and SSL
        shell: bash
        env:
          MAVEN_SETTINGS_CONTENT: ${{ secrets.MAVEN_SETTINGS }}
        run: |
          if [[ -n "$MAVEN_SETTINGS_CONTENT" ]]; then
            umask 077
            settings=$(mktemp "$RUNNER_TEMP/tapdata-maven-settings.XXXXXX")
            # BEGIN Maven settings merge
            python3 - "$HOME/.m2/settings.xml" "$settings" <<'PY'
          import copy
          import os
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def merge_settings(base_xml, secret_xml):
              base = ET.fromstring(base_xml)
              secret = ET.fromstring(secret_xml)
              for root in (base, secret):
                  for node in root.iter():
                      node.tag = node.tag.rsplit("}", 1)[-1]
                  if root.tag != "settings":
                      raise ValueError("Maven settings root must be settings")
              merged = copy.deepcopy(base)
              for section in secret:
                  # Runner routing and cache isolation cannot be overridden by a secret.
                  if section.tag in ("mirrors", "localRepository"):
                      continue
                  existing = merged.find(section.tag)
                  if section.tag in ("servers", "profiles", "pluginGroups", "activeProfiles"):
                      if existing is None:
                          merged.append(copy.deepcopy(section))
                          continue
                      for item in section:
                          key = item.findtext("id") if section.tag in ("servers", "profiles") else item.text
                          for old in list(existing):
                              old_key = old.findtext("id") if section.tag in ("servers", "profiles") else old.text
                              if old_key == key:
                                  existing.remove(old)
                          existing.append(copy.deepcopy(item))
                  else:
                      if existing is not None:
                          merged.remove(existing)
                      merged.append(copy.deepcopy(section))
              groups = merged.find("pluginGroups")
              if groups is None:
                  groups = ET.SubElement(merged, "pluginGroups")
              if not any(node.text == "org.sonarsource.scanner.maven" for node in groups):
                  ET.SubElement(groups, "pluginGroup").text = "org.sonarsource.scanner.maven"
              # Fail rather than silently losing the runner's required Nexus mirror.
              if not any(m.findtext("id") == "tapdata-nexus"
                         and m.findtext("mirrorOf") == "*"
                         and m.findtext("url") == "https://nexus.tapdata.net/repository/maven-public/"
                         for m in merged.findall("./mirrors/mirror")):
                  raise ValueError("Runner settings must define the tapdata-nexus mirror")
              return ET.tostring(merged, encoding="unicode")

          if __name__ == "__main__":
              base_path = Path(sys.argv[1])
              if not base_path.is_file():
                  raise SystemExit("Runner Maven settings missing; refusing to replace with secret")
              content = merge_settings(base_path.read_text(), os.environ["MAVEN_SETTINGS_CONTENT"])
              Path(sys.argv[2]).write_text(content)
              os.chmod(sys.argv[2], 0o600)
          PY
            # END Maven settings merge
            echo "MAVEN_JOB_SETTINGS=$settings" >> "$GITHUB_ENV"
          fi
          # 自托管 runner 环境：内网 Nexus 使用自签名证书，跳过 SSL 验证
          echo "MAVEN_OPTS=-Dmaven.wagon.http.ssl.insecure=true -Dmaven.wagon.http.ssl.allowall=true" >> "$GITHUB_ENV"

      # 第零步：预装 connectors-common 聚合 POM 声明的全部公共模块到本地仓库（-am 自动带上父 POM 与模块间依赖），
      # 保证 connector 依赖链（-am）之外的公共模块也能从本地仓库解析，避免矩阵任务重复全量安装；
      # 模块列表从 <modules> 声明提取而非扫描目录，避免未声明的游离目录（如 build/dist）破坏 -pl；
      # SSL 参数显式写在命令上（不依赖 MAVEN_OPTS），覆盖自签名证书的内网 Nexus
      - name: Resolve connectors-common modules
        id: common-modules
        shell: bash
        run: |
          if [[ -f connectors-common/pom.xml ]]; then
            modules="$(awk '/^[[:space:]]*<module>/{gsub(/.*<module>|<\/module>.*/, ""); print "connectors-common/"$0}' connectors-common/pom.xml | paste -sd, -)"
            echo "modules=${modules}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install connectors-common modules (skip all tests)
        if: steps.common-modules.outputs.modules != ''
        uses: tapdata/tapdata-it/.github/actions/maven-retry@main
        with:
          args: |
            -U
            -B
            install
            -pl
            connectors-common,${{ steps.common-modules.outputs.modules }}
            -am
            -DskipITs=true
            -DskipTests
            -Dmaven.javadoc.skip=true
            -q
            -Dmaven.wagon.http.ssl.insecure=true
            -Dmaven.wagon.http.ssl.allowall=true
      
      # 第一步：安装依赖链（-am 会带入 connectors-common 等依赖模块）但不执行任何测试，
      # 防止公共模块自身的 IT 被连带执行；SSL 参数同上（内网 Nexus 自签名证书）
      - name: Install dependency chain (skip all tests)
        uses: tapdata/tapdata-it/.github/actions/maven-retry@main
        with:
          args: |
            -U
            -B
            install
            -pl
            ${{ matrix.connector }}
            -am
            -DskipITs=true
            -DskipTests
            -Dmaven.javadoc.skip=true
            -q
            -Dmaven.wagon.http.ssl.insecure=true
            -Dmaven.wagon.http.ssl.allowall=true
      
      # 第二步：仅目标模块执行 failsafe 集成测试。
      # test-compile 触发 build-helper 将 src/it/java 加入测试源码并编译；
      # 直接调用 failsafe goals 而非 verify，确保 surefire 单测完全不执行
      # （规避 JDK 17+/Byte Buddy 兼容问题，与本地实践一致）；
      # -DskipITs=false 覆盖各 connector pom 中默认的 skipITs=true；SSL 参数同上
      - name: Run integration tests
        uses: tapdata/tapdata-it/.github/actions/maven-retry@main
        with:
          working-directory: ${{ matrix.connector }}
          args: |
            -U
            -B
            test-compile
            failsafe:integration-test
            failsafe:verify
            -DskipITs=false
            -Dmaven.wagon.http.ssl.insecure=true
            -Dmaven.wagon.http.ssl.allowall=true

      # 报告打包上传（失败也上传），artifact 名称关联仓库 owner、模块与 commit SHA
      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports-${{ github.repository_owner }}-${{ steps.name.outputs.safe }}-${{ github.sha }}
          path: |
            ${{ matrix.connector }}/target/failsafe-reports/**
            ${{ matrix.connector }}/target/surefire-reports/**
          if-no-files-found: ignore

      # job summary 输出模块、事件、PR 号与 commit 关联信息
      - name: Summarize results
        if: always()
        shell: bash
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          {
            printf '## IT results: `%s`\n' "$CONNECTOR"
            echo ""
            echo "- 事件: ${{ github.event_name }}"
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              echo "- PR: #${{ github.event.pull_request.number }}"
            fi
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Artifact: \`failsafe-reports-${{ github.repository_owner }}-${{ steps.name.outputs.safe }}-${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # 收尾：无论成败清理 SOCKS 代理进程
      - name: Remove temporary Maven settings
        if: always()
        shell: bash
        run: |
          if [[ -n "${MAVEN_JOB_SETTINGS:-}" && "$MAVEN_JOB_SETTINGS" == "$RUNNER_TEMP"/tapdata-maven-settings.* ]]; then
            rm -f -- "$MAVEN_JOB_SETTINGS"
          fi

      - name: Stop SOCKS proxy
        if: always()
        shell: bash
        run: |
          pkill -f 'ssh .*-D 1234' || true
