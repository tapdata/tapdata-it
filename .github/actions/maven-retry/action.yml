name: Maven with retry
description: Run a Maven command with bounded retries for transient repository failures
inputs:
  args:
    description: Maven arguments, one argument per line
    required: true
  working-directory:
    description: Directory from which Maven runs
    required: false
    default: .
runs:
  using: composite
  steps:
    - name: Run Maven with retry
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MAVEN_ARGUMENTS: ${{ inputs.args }}
      run: |
        # YAML block scalars and here-strings both add trailing newlines.
        # Ignore blank lines without splitting or evaluating individual arguments.
        maven_args=()
        while IFS= read -r argument; do
          [[ "$argument" =~ ^[[:space:]]*$ ]] && continue
          maven_args+=("$argument")
        done <<< "$MAVEN_ARGUMENTS"
        if (( ${#maven_args[@]} == 0 )); then
          echo "::error::Maven arguments must not be empty"
          exit 2
        fi
        if [[ -n "${MAVEN_JOB_SETTINGS:-}" ]]; then
          [[ -f "$MAVEN_JOB_SETTINGS" ]] || { echo "::error::Job Maven settings missing"; exit 1; }
          maven_args=(--settings "$MAVEN_JOB_SETTINGS" "${maven_args[@]}")
        fi
        bash "$GITHUB_ACTION_PATH/retry-maven.sh" mvn "${maven_args[@]}"
